# Worker config for the smoke test. On the cluster, Strimzi generates the equivalent from the KafkaConnect CR.
bootstrap.servers=kafka:9092
group.id=smoke-connect
config.storage.topic=smoke-connect-configs
offset.storage.topic=smoke-connect-offsets
status.storage.topic=smoke-connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
offset.flush.interval.ms=5000
listeners=http://0.0.0.0:8083
plugin.path=/opt/kafka/plugins
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false
# Connectors may only override their client identity (security.protocol, sasl.*), as on the cluster.
connector.client.config.override.policy=Principal
config.providers=env,file
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
