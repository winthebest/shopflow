# Only the Trino connector layer restricts: iceberg.security=READ_ONLY.
connector.name=iceberg
iceberg.security=READ_ONLY
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=spike
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_SPIKE_ADMIN_CREDENTIAL}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.file-format=PARQUET
# 0s, so that a procedure the layers allow really removes something.
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s
fs.s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=${ENV:S3_SPIKE_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SPIKE_SECRET_KEY}
