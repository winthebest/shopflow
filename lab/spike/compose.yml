# Overlay for the boundary spike (lab/stack.sh up spike): OPA chained after Trino's file-based access control, and the
# layer-probe catalogs in lab/spike/trino/catalog (copied next to the base catalogs by stack.sh). Paths are relative to
# lab/, the project directory.
services:
  opa:
    image: openpolicyagent/opa:1.21.1@sha256:d3a9a6bd4fbcb0f4403294b0d0b239b07be163ac118a46df7d50045b52e52053
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-format=json", "--set=decision_logs.console=true",
              "/policy/policy.rego"]
    volumes:
      - ./spike/opa:/policy:ro
    mem_limit: 128m

  trino:
    environment:
      LAB_ACCESS_CONTROL_FILES: /etc/trino/access-control.properties,/etc/trino/access-control-opa.properties
    volumes:
      - ./spike/opa/access-control-opa.properties:/etc/trino/access-control-opa.properties:ro
    depends_on:
      opa: {condition: service_started}
