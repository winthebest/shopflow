# Standalone uv project (not a member of the shop services workspace): the research harness that runs experiments on
# the lab stack (lab/compose.yml, lab/stack.sh). Package lab in src/lab/; it builds on lakeops (../lakeops).
# Experiments live in experiments/ and run inside this project (`uv run --project lab …`).
[project]
name = "lab"
version = "0.1.0"
description = "Research harness for lakehouse experiments on the lab stack"
requires-python = ">=3.12"
dependencies = [
    "lakeops",
    "pyarrow>=21",  # result files (lab.results)
    "pyiceberg[pyarrow]==0.12.0",
    "requests>=2.32",
    "trino==0.340.0",
    # The agent's runtime pins, exactly as in agent/pyproject.toml (lab/tests/test_agent_pins.py), for experiments
    # that drive the agent (agent_safety): agent/ and evals/ are imported from the repository root.
    "anthropic==1.15.0",
    "httpx2==2.13.1",
    "jsonschema==4.26.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "pyyaml==6.0.3",  # also the scenario files
    "sqlglot==30.21.0",
]

[tool.uv.sources]
lakeops = { path = "../lakeops", editable = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments"]
pythonpath = ["experiments"]  # each experiment is a package (e.g. `import e7_concurrency.oplog`)
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
markers = [
  "lab: needs the lab stack running (lab/stack.sh up); skipped when it is not, failed when LAB_REQUIRED=1",
]
