# Template of a baseline run's catalog lab_base_<run> (rendered by lab/stack.sh base <run>; @RUN@ and @RUN_UPPER@ are
# the run id): the run's own Polaris warehouse on s3://lab-base/<run>/warehouse and principal, the bucket's key, so the
# baseline writes freely inside its run and reaches nothing else. Identity baseline_writer.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lab_base_@RUN@
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_LAB_BASE_@RUN_UPPER@_CREDENTIAL}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.file-format=PARQUET
# Floors: 7 simulated days at the published time scale, as lab_ops, so the baseline and the executor face the same.
iceberg.expire-snapshots.min-retention=7m
iceberg.remove-orphan-files.min-retention=7m
fs.s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=${ENV:S3_BASE_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_BASE_SECRET_KEY}
