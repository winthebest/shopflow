# Template of a baseline run's read-only catalog lab_base_ro_<run> (rendered by lab/stack.sh base <run>, with
# lab_base_<run>): the run's warehouse read only, at three layers. Identity observer, for state captures.
connector.name=iceberg
iceberg.security=READ_ONLY
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lab_base_@RUN@
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_LAB_BASE_RO_@RUN_UPPER@_CREDENTIAL}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.file-format=PARQUET
# Floors: 7 simulated days at the published time scale, 1 simulated day = 1 real minute (lab/src/lab/timescale.py).
iceberg.expire-snapshots.min-retention=7m
iceberg.remove-orphan-files.min-retention=7m
fs.s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=${ENV:S3_BASE_RO_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_BASE_RO_SECRET_KEY}
