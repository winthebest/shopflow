# Executor dry runs: read/write on the sandbox warehouse only (clones of evaluation tables).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lab_sandbox
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_LAB_SBX_CREDENTIAL}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.file-format=PARQUET
iceberg.expire-snapshots.min-retention=7d
iceberg.remove-orphan-files.min-retention=7d
fs.s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=${ENV:S3_SANDBOX_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SANDBOX_SECRET_KEY}
