# agent_planner: the evaluation warehouse read only, at three layers (Trino read_only, Polaris principal, S3 key).
connector.name=iceberg
iceberg.security=READ_ONLY
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lab_evalprod
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_LAB_RO_CREDENTIAL}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.file-format=PARQUET
# Floors: 7 simulated days at the published time scale, 1 simulated day = 1 real minute (lab/src/lab/timescale.py).
iceberg.expire-snapshots.min-retention=7m
iceberg.remove-orphan-files.min-retention=7m
fs.s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=${ENV:S3_EVALPROD_RO_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_EVALPROD_RO_SECRET_KEY}
