# Single node, like the platform's coordinator (workers: 0, includeCoordinator: true).
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
# HTTP stays on inside the container for internal calls and the image's health check; only 8443 is published.
http-server.http.port=8080
http-server.https.enabled=true
http-server.https.port=8443
# Key + self-signed certificate in one PEM file (the platform mounts cert-manager's CombinedPEM the same way).
http-server.https.keystore.path=/etc/trino/tls/trino.pem
http-server.authentication.type=PASSWORD
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
# File-based access control, plus whatever an overlay chains after it (lab/spike adds OPA): every one must allow.
access-control.config-files=${ENV:LAB_ACCESS_CONTROL_FILES}
# Query memory as on the platform's local overlay (deploy/platform/trino/local/values.yaml).
query.max-memory=1GB
query.max-memory-per-node=768MB
