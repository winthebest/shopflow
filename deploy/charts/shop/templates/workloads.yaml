{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
{{- if include "shop.renders" $ctx }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "shop.labels" $ctx | nindent 4 }}
spec:
  {{- if not (or $svc.autoscaling $svc.hpa) }}
  replicas: {{ $svc.replicas }}
  {{- end }}{{/* otherwise an HPA owns the replica count: KEDA's (worker) or the one below (api) */}}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" $ctx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "shop.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shop.serviceAccountName" $ }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $.Values.lifecycle.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "shop.podSecurityContext" $ctx | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "shop.selectorLabels" $ctx | nindent 14 }}
      containers:
        - name: {{ $name }}
          image: {{ include "shop.image" (dict "name" $name "image" $svc.image) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            {{- include "shop.commonEnv" $ctx | nindent 12 }}
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if $svc.secretEnv }}
            {{- include "shop.secretEnv" $ctx | nindent 12 }}
            {{- end }}
            {{- if eq ($svc.kind | default "api") "worker" }}
            {{- include "shop.workerKafkaEnv" $ | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            {{- toYaml $.Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            {{- toYaml $.Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            {{- toYaml $.Values.probes.readiness | nindent 12 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $.Values.lifecycle.preStopSleepSeconds }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            {{- include "shop.containerSecurityContext" $ctx | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq ($svc.kind | default "api") "worker" }}
            - name: kafka-ca
              mountPath: /etc/kafka-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if eq ($svc.kind | default "api") "worker" }}
        - name: kafka-ca
          secret:
            secretName: {{ $.Values.worker.kafka.caSecret }}
            items:
              - {key: ca.crt, path: ca.crt}
        {{- end }}
{{- if ne ($svc.kind | default "api") "worker" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "shop.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "shop.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- with $svc.hpa }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "shop.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .minReplicas }}
  maxReplicas: {{ .maxReplicas }}
  metrics:
    # Absolute CPU per pod, not a percentage of requests: the threshold comes from measurement and does not move
    # when requests are tuned for scheduling.
    - type: Resource
      resource:
        name: cpu
        target:
          type: AverageValue
          averageValue: {{ .cpuAverage | quote }}
{{- end }}
---
# Voluntary disruptions (drains, upgrades) take down at most one pod per service at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "shop.labels" $ctx | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
