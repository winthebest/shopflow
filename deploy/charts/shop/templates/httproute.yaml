{{- if .Values.route.enabled }}
# The only public route: shop host -> gateway Service. The Gateway admits routes from namespace `shop` only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  labels:
    {{- include "shop.labels" (dict "root" $ "name" .Values.route.service) | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.parentRef.name }}
      namespace: {{ .Values.route.parentRef.namespace }}
      sectionName: {{ .Values.route.parentRef.sectionName }}
  hostnames:
    - {{ required "route.hostname is required" .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.route.service }}
          port: {{ (index .Values.services .Values.route.service).port }}
{{- end }}
