# k3d overlay: one replica each (PDBs still allow a drain), demo data seeded, laptop hostname, telemetry on.
environment: local
# Every local validation profile includes obs or obs-lite (docs/contracts/services.md); on a core-only cluster the
# SDK only logs exporter warnings.
otel:
  enabled: true
services:
  gateway:
    replicas: 1
  orders:
    replicas: 1
  payments:
    replicas: 1
    env:
      PAYMENT_LATENCY_MS: "600"   # EXPERIMENT (never merged): Phase 3 step 7, page timing for checkout-latency
seed:
  enabled: true
route:
  hostname: shop.127.0.0.1.sslip.io
