# Shop chart defaults (environment-neutral). Runtime contract: docs/contracts/services.md.
# Overlays: values-local.yaml (k3d); an aws file is added in Phase 6.

# Which block this release renders: `web` (app `shop`: API services, migration, seed, route) or `worker` (app
# `fulfillment-worker`, profile ops). Both apps read this file, so one image bump covers both.
component: web

# deployment.environment resource attribute for telemetry.
environment: ""
logLevel: INFO

# OpenTelemetry stays off until Phase 3 provides the collector (contract: OTEL_SDK_DISABLED=true until then).
otel:
  enabled: false
  endpoint: http://otel-gateway.observability.svc:4317

# Images from ghcr.io/winthebest (multi-arch index digests). The tag is for humans; the digest is what runs.
services:
  gateway:
    image:
      repository: ghcr.io/winthebest/shopflow-gateway
      tag: sha-c35f922
      digest: sha256:3ecc7b3b88a5d6d0fd02d28b53e98d1a6a3b48597cf5735340a1b7387b53d48c
    port: 8000
    # HorizontalPodAutoscaler on average CPU per pod (replaces `replicas`). A proxy: 407m at 80 checkouts/s on one
    # replica (docs/perf-baseline.md, 2026-10-10); it holds no database connection.
    hpa:
      minReplicas: 2
      maxReplicas: 6
      cpuAverage: 400m
    env:
      ORDERS_URL: http://orders.shop.svc:8001
    resources:
      requests: {cpu: 50m, memory: 96Mi}
      limits: {memory: 256Mi}
  orders:
    image:
      repository: ghcr.io/winthebest/shopflow-orders
      tag: sha-c35f922
      digest: sha256:40fcd26749b4bf83ead9fc0272522d38841db018ae484e4b745492627c02ac77
    port: 8001
    # One Python process per pod saturates near one core: 881m at 80 checkouts/s, where queued requests held their
    # connections and the pool ran dry. 500m keeps a replica near 45 checkouts/s. maxReplicas x (DB_POOL_SIZE +
    # DB_MAX_OVERFLOW) = 4 x 15 stays inside shop-db's max_connections (100) next to the other roles.
    hpa:
      minReplicas: 2
      maxReplicas: 4
      cpuAverage: 500m
    env:
      PAYMENTS_URL: http://payments.shop.svc:8002
    # DATABASE_URL comes from the Secret CNPG creates for the bootstrap owner `shop_app`.
    databaseSecret:
      name: shop-db-app
      key: uri
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 320Mi}
  payments:
    image:
      repository: ghcr.io/winthebest/shopflow-payments
      tag: sha-c35f922
      digest: sha256:2b8a2201048bcf2d7b631fbda3f709387932a1c2c0e16fc9f26bc26ff8055935
    port: 8002
    replicas: 2
    env:
      PAYMENT_LATENCY_MS: "50"
      PAYMENT_FAILURE_RATE: "0.02"
    resources:
      requests: {cpu: 50m, memory: 96Mi}
      limits: {memory: 256Mi}

  # CDC consumer: one shipment per paid order (component worker only; no Service, scaled by KEDA on consumer lag).
  fulfillment-worker:
    kind: worker
    image:
      repository: ghcr.io/winthebest/shopflow-fulfillment-worker
      tag: sha-c35f922
      digest: sha256:15705c4f5527ace0ea76be81e8f441810b71098034738d637ecfa091272ba91b
    port: 8003
    env:
      DATABASE_HOST: shop-db-rw.shop.svc
      DATABASE_SSLMODE: require
      # Simulated carrier call per shipment. To produce lag in a demo raise it and lower BATCH_MAX_RECORDS (default 500):
      # latency x batch must stay <= 60s or the worker refuses to start (liveness stall bound).
      SHIPMENT_LATENCY_MS: "20"
    # CNPG managed role fulfillment_worker: INSERT on shipments, SELECT on orders.id (docs/contracts/services.md).
    secretEnv:
      DATABASE_USER: {name: shop-db-fulfillment-worker, key: username}
      DATABASE_PASSWORD: {name: shop-db-fulfillment-worker, key: password}
    autoscaling:                  # KEDA Kafka scaler (docs/adr/0304)
      minReplicaCount: 1
      maxReplicaCount: 6          # <= partitions of shop.public.orders (6, sf-data); more consumers would idle
      lagThreshold: 50            # records per replica; re-measure with k6 before the game day
      pollingInterval: 15
      scaleDownStabilizationSeconds: 60   # back to minReplicaCount 60s after the lag is drained
    resources:
      requests: {cpu: 50m, memory: 96Mi}
      limits: {memory: 256Mi}

# Schema migration: Argo CD PreSync hook, so it finishes before any pod of the new release rolls out.
migration:
  enabled: true
  service: orders          # image + DATABASE_URL source
  command: ["migrate"]
  activeDeadlineSeconds: 300

# Demo data (idempotent `seed` entrypoint): PostSync hook, after the services are up.
seed:
  enabled: false
  service: orders
  command: ["seed"]
  activeDeadlineSeconds: 300

# The only public route (docs/adr/0205-admin-ui-port-forward-only.md). Hostname is set per environment; empty
# matches any host (AWS).
route:
  enabled: true
  service: gateway
  hostname: ""
  parentRef:
    name: shopflow
    namespace: envoy-gateway-system
    sectionName: https

# Probes and lifecycle from the runtime contract: preStop sleep so endpoints drop before uvicorn closes its socket,
# 20s drain + margin within the grace period, readiness timeout 2s.
lifecycle:
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
probes:
  readiness: {periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
  liveness: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
  startup: {periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 30}

# Worker wiring (component worker). The KafkaUser and its ACL are sf-data's (deploy/platform/kafka/base/users.yaml);
# the copy Jobs write `credentialsSecret` (password + username) and `caSecret` (cluster CA) into this namespace.
worker:
  kafka:
    namespace: kafka
    cluster: shopflow
    bootstrapServers: shopflow-kafka-bootstrap.kafka.svc:9093
    topic: shop.public.orders
    consumerGroup: fulfillment-worker
    user: fulfillment-worker
    credentialsSecret: fulfillment-worker-kafka
    caSecret: fulfillment-worker-kafka-ca
    protocolVersion: "3.6.0"   # KEDA scaler client protocol; >= 2.1 for Kafka 4.x. Check the ScaledObject is Ready.
  # Same pinned image as the other copy-secret Jobs (deploy/platform/*/base/secret-copy.yaml).
  copyImage: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
