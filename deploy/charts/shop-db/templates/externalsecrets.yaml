{{- if .Values.externalSecrets.enabled }}
{{- range $name := include "shop-db.enabled" .Values.roles | fromJsonArray }}
{{- $role := index $.Values.roles $name }}
---
# Role password from SSM (one SecureString with JSON {username, password}); same name and keys as the local
# SOPS Secret. The value must never change: the role comes back with the database restored every session.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $role.secret }}
  labels:
    app.kubernetes.io/part-of: shopflow
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.externalSecrets.store }}
  target:
    name: {{ $role.secret }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: {{ $.Values.externalSecrets.keyPrefix }}/{{ $role.secret }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $.Values.externalSecrets.keyPrefix }}/{{ $role.secret }}
        property: password
{{- end }}
{{- end }}
