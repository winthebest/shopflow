{{- if not .Values.listener.hostname }}
# No listener hostname: cert-manager's Gateway API support skips such listeners, so issue the certificate here.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.tls.secretName }}
  labels:
    app.kubernetes.io/part-of: shopflow
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.tls.secretName }}
  dnsNames:
    {{- toYaml (required "tls.dnsNames is required when listener.hostname is empty" .Values.tls.dnsNames) | nindent 4 }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .Values.tls.clusterIssuer }}
{{- end }}
