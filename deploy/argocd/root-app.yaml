# Template for one root Application per profile. scripts/k3d-up.sh renders it for each entry of PROFILES:
#   metadata.name                   -> root-<profile>
#   spec.source.path                -> deploy/argocd/profiles/<profile>
#   spec.source.targetRevision      -> GIT_REVISION (main on sf-main, the lane branch on a lane cluster)
#   the git-revision patch value    -> GIT_REVISION, copied into every child Application's Git sources
#                                      by the replacements block of each profile
# The file is valid as-is (profile core, revision main), so CI validates it like any other manifest.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-core
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopflow
    shopflow.io/profile: core
spec:
  project: default
  source:
    repoURL: https://github.com/winthebest/shopflow.git
    targetRevision: main
    path: deploy/argocd/profiles/core
    kustomize:
      patches:
        - target:
            kind: ConfigMap
            name: git-revision
          patch: |-
            - op: replace
              path: /data/revision
              value: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
