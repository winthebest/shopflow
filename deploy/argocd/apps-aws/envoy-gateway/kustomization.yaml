# AWS variant of envoy-gateway: aws values for the controller and the edge chart (NLB class, operatorCidr), and
# wave 0 so the AWS LB Controller and External Secrets (wave -1, profiles-aws/core) are Healthy before the
# Gateway's LoadBalancer Service exists (gitops.md §1b).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/envoy-gateway
patches:
  - target: {kind: Application, name: envoy-gateway}
    patch: |-
      - op: replace
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "0"
      - op: replace
        path: /spec/sources/0/helm/valueFiles/1
        value: $values/deploy/platform/envoy-gateway/aws/values.yaml
      - op: replace
        path: /spec/sources/2/helm/valueFiles/1
        value: values-aws.yaml
