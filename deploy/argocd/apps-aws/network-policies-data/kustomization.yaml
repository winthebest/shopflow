# AWS variant of network-policies-data: deploy/platform/network-policies/data-aws (API server egress on 443 to the VPC).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/network-policies-data
patches:
  - target: {kind: Application, name: network-policies-data}
    patch: |-
      - op: replace
        path: /spec/sources/0/path
        value: deploy/platform/network-policies/data-aws
