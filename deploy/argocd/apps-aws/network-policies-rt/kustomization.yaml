# AWS variant of network-policies-rt: deploy/platform/network-policies/rt-aws (API server egress on 443 to the VPC, S3 + Glue).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/network-policies-rt
patches:
  - target: {kind: Application, name: network-policies-rt}
    patch: |-
      - op: replace
        path: /spec/sources/0/path
        value: deploy/platform/network-policies/rt-aws
