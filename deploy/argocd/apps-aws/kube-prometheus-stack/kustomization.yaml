# AWS variant of kube-prometheus-stack: aws values (admin API for evidence snapshots) and the aws overlay
# (ExternalSecrets instead of KSOPS).
# Each `test` op fails the build if the local app's source layout changes, instead of patching the wrong entry.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/kube-prometheus-stack
patches:
  - target: {kind: Application, name: kube-prometheus-stack}
    patch: |-
      - op: test
        path: /spec/sources/0/helm/valueFiles/1
        value: $values/deploy/platform/kube-prometheus-stack/local/values.yaml
      - op: replace
        path: /spec/sources/0/helm/valueFiles/1
        value: $values/deploy/platform/kube-prometheus-stack/aws/values.yaml
      - op: test
        path: /spec/sources/2/path
        value: deploy/platform/kube-prometheus-stack/local
      - op: replace
        path: /spec/sources/2/path
        value: deploy/platform/kube-prometheus-stack/aws
