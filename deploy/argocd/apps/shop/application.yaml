# Shop services from the in-repo chart (deploy/charts/shop): migration PreSync hook, Deployments, PDBs,
# the public HTTPRoute, then the seed PostSync hook.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopflow
    shopflow.io/profile: core
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      path: deploy/charts/shop
      helm:
        releaseName: shop
        valueFiles:
          - values.yaml
          - values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  # The chart's HPAs own these replica counts (the Deployments omit spec.replicas).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: gateway
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: orders
      jsonPointers:
        - /spec/replicas
