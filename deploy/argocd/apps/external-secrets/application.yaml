# External Secrets Operator (AWS only; locally secrets come from SOPS + KSOPS, ADR 0204/0508):
#   source 1  upstream chart: controller, webhook, cert controller, CRDs
#   source 3  ./secret-stores chart: one SSM ClusterSecretStore per namespace (role shopflow-eso-<namespace>,
#             assumed through Pod Identity). The ExternalSecrets live in each component's aws overlay.
# Session parameter (platform-params, ADR 0206; the aws profile replaces the placeholder):
#   aws.accountId -> source 3 helm.valuesObject.accountId
# Runs in profiles-aws/core at wave -1 (gitops.md §1b).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopflow
    shopflow.io/profile: core
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.11.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/deploy/platform/external-secrets/base/values.yaml
          - $values/deploy/platform/external-secrets/aws/values.yaml
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      path: deploy/platform/external-secrets/aws/secret-stores
      helm:
        releaseName: shopflow-secret-stores
        valueFiles:
          - values.yaml
        valuesObject:
          accountId: "000000000000"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
