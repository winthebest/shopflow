# Postgres for the shop (CNPG Cluster shop-db). A stateful backend at wave 0, so it is ready before the shop
# app's PreSync migration hook runs (a hook cannot wait for a Cluster created in its own app).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-db
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopflow
    shopflow.io/profile: core
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    # Cluster, roles, databases (in-repo chart; session params reach it as Helm values on AWS, ADR 0206).
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      path: deploy/charts/shop-db
      helm:
        releaseName: shop-db
        valueFiles:
          - values.yaml
          - values-local.yaml
    # Role passwords from SOPS through KSOPS (the aws variant replaces this with External Secrets in the chart).
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      path: deploy/platform/shop-db/local
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
