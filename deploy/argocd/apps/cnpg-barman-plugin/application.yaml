# CNPG-I barman-cloud plugin: WAL archiving, base backups and recovery for shop-db (ADR 0203). Wave 0: it needs
# cert-manager (TLS between operator and plugin) and the CNPG operator from wave -1.
# Local (listed by profile data, and by drill for the restore drill): backups go to SeaweedFS; the third source copies the credentials of sf-data's
# identity cnpg-backup into shop/shop-db-backup-s3. AWS (apps-aws/cnpg-barman-plugin, profiles-aws/core): S3 through
# the pod's IAM role, no copy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-barman-plugin
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopflow
    shopflow.io/profile: data  # also listed by profile drill
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: plugin-barman-cloud
      targetRevision: 0.8.0
      helm:
        releaseName: barman-cloud
        valueFiles:
          - $values/deploy/platform/cnpg/base/barman-plugin-values.yaml
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      path: deploy/platform/cnpg/local-backup
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
