# Trino (catalogs lake, lake_ro, pg) + TLS certificate + bronze table Job.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trino
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopflow
    shopflow.io/profile: data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse
  sources:
    - repoURL: https://trinodb.github.io/charts
      chart: trino
      targetRevision: 1.42.2
      helm:
        releaseName: trino
        valueFiles:
          - $values/deploy/platform/trino/base/values.yaml
          - $values/deploy/platform/trino/local/values.yaml
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      path: deploy/platform/trino/local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
