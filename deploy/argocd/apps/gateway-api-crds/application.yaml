# Gateway API CRDs (standard channel) + Envoy Gateway CRDs, installed before any controller (wave -2).
# Prune is off on purpose: deleting a CRD deletes every object of that kind in the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopflow
    shopflow.io/profile: core
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: docker.io/envoyproxy
      chart: gateway-crds-helm
      targetRevision: 1.9.1
      helm:
        releaseName: gateway-api-crds
        valueFiles:
          - $values/deploy/platform/gateway-api-crds/base/values.yaml
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
