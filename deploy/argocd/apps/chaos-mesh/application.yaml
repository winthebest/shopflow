# Chaos Mesh for game days only: listed only in profile `chaos`, which is created at the start of a game day and
# deleted right after (the finalizer removes CRDs, daemon and webhooks). docs/runbooks/gameday.md, ADR 0303.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopflow
    shopflow.io/profile: chaos
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-mesh
  sources:
    - repoURL: https://charts.chaos-mesh.org
      chart: chaos-mesh
      targetRevision: 2.8.4
      helm:
        releaseName: chaos-mesh
        valueFiles:
          - $values/deploy/platform/chaos-mesh/base/values.yaml
          - $values/deploy/platform/chaos-mesh/local/values.yaml
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      path: deploy/platform/chaos-mesh/local
  # cert-manager's cainjector writes the webhooks' caBundle at runtime.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: [".webhooks[].clientConfig.caBundle"]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: [".webhooks[].clientConfig.caBundle"]
    # Chart 2.8.4 stamps `rollme: randAlphaNum 5` on the controller's pod template (always) and the daemon's (with
    # mTLS, which we keep), so every render of the chart differs. Each re-render then reads as a change and selfHeal
    # rolls Chaos Mesh out again, which can keep a fresh cluster's first sync rolling out for many minutes. The chart
    # comes straight from its Helm repository (no kustomize step to patch the annotation out), so the diff is ignored.
    - group: apps
      kind: Deployment
      name: chaos-controller-manager
      jqPathExpressions: [".spec.template.metadata.annotations.rollme"]
    - group: apps
      kind: DaemonSet
      name: chaos-daemon
      jqPathExpressions: [".spec.template.metadata.annotations.rollme"]
  syncPolicy:
    # The daemon is privileged (it injects faults into other pods' namespaces): the namespace says so explicitly,
    # instead of an implicit default (docs/adr/0208-psa-and-network-policies.md). It exists only during a game day.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: privileged
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    # Like the root and shop-db: a first sync that fails on something transient (a webhook not ready yet) is retried.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
