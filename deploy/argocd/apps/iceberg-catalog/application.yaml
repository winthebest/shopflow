# Apache Polaris Iceberg REST catalog + bootstrap/setup Jobs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iceberg-catalog
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopflow
    shopflow.io/profile: data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse
  sources:
    - repoURL: https://downloads.apache.org/polaris/helm-chart
      chart: polaris
      targetRevision: 1.8.0
      helm:
        releaseName: polaris
        valueFiles:
          - $values/deploy/platform/iceberg-catalog/base/values.yaml
          - $values/deploy/platform/iceberg-catalog/local/values.yaml
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      path: deploy/platform/iceberg-catalog/local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
