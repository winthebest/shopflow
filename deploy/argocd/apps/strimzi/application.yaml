# Strimzi Cluster Operator (CRDs + operator). OCI chart: repoURL without oci:// is detected as OCI by Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopflow
    shopflow.io/profile: data
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  sources:
    - repoURL: quay.io/strimzi-helm
      chart: strimzi-kafka-operator
      targetRevision: 1.2.0
      helm:
        releaseName: strimzi
        valueFiles:
          - $values/deploy/platform/strimzi/base/values.yaml
          - $values/deploy/platform/strimzi/local/values.yaml
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      ref: values
  ignoreDifferences:
    # The chart declares `properties: {}` (with x-kubernetes-preserve-unknown-fields) for status.clusterSecurity; the
    # API server drops the empty map when it stores the CRD, so the app would stay OutOfSync on it forever. The live
    # CRD and the rendered chart differ in nothing else.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: kafkas.kafka.strimzi.io
      jqPathExpressions:
        - .spec.versions[].schema.openAPIV3Schema.properties.status.properties.clusterSecurity.properties
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
