# freshness-exporter: data freshness of bronze tables through Trino (cdc-lag SLI), scraped by Prometheus.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: freshness-exporter
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopflow
    shopflow.io/profile: data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse
  sources:
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      path: deploy/platform/freshness-exporter/local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
