# Airflow 3 (LocalExecutor) with the shopflow DAGs: hourly dbt, daily Iceberg maintenance and reconciliation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopflow
    shopflow.io/profile: batch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  sources:
    # Helm index in this repo (deploy/platform/airflow/helm-repo): the official chart, but fetched from dlcdn.apache.org
    # because archive.apache.org, where the official index points, is unreachable from the local network. The URL
    # follows `main`, not the session's revision; the chart version below stays pinned either way.
    - repoURL: https://raw.githubusercontent.com/winthebest/shopflow/main/deploy/platform/airflow/helm-repo
      chart: airflow
      targetRevision: 1.22.0
      helm:
        releaseName: airflow
        valueFiles:
          - $values/deploy/platform/airflow/base/values.yaml
          - $values/deploy/platform/airflow/local/values.yaml
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/winthebest/shopflow.git
      targetRevision: main
      path: deploy/platform/airflow/local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
