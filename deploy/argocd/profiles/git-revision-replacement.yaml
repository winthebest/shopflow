# Copies the profile's Git revision into every source of every Application that points at this repo.
# Chart sources (other repoURLs) keep their pinned chart version.
# Requirement for app files: use `spec.sources` (a list, even with one entry) and include at least one source
# with this repoURL. Kustomize fails the build otherwise, which is the intended guard.
source:
  kind: ConfigMap
  name: git-revision
  fieldPath: data.revision
targets:
  - select:
      kind: Application
    fieldPaths:
      - spec.sources.[repoURL=https://github.com/winthebest/shopflow.git].targetRevision
