# Profile `ops` (owner: sf-sre; docs/contracts/gitops.md §4): always-on operations add-ons from Phase 7. KEDA is
# identical on k3d and EKS. Chaos Mesh is NOT here: it lives in the game-day-only profile `chaos`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/keda
components:
  - ../_common
# Must stay inline (see ../../profiles/_common/kustomization.yaml). No session parameters are consumed.
replacements:
  - source: {kind: ConfigMap, name: git-revision, fieldPath: data.revision}
    targets:
      - select: {kind: Application}
        fieldPaths:
          - spec.sources.[repoURL=https://github.com/winthebest/shopflow.git].targetRevision
