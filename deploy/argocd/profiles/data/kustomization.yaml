# Profile `data` (sf-data): CDC + lakehouse ingest. Shape fixed by docs/contracts/gitops.md section 4.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Namespaces with their Pod Security level and default-deny NetworkPolicies (sf-platform, wave -2).
  - ../../apps/network-policies-data
  - ../../apps/strimzi
  - ../../apps/kafka
  - ../../apps/kafka-connect
  - ../../apps/seaweedfs
  - ../../apps/iceberg-catalog
  - ../../apps/trino
  - ../../apps/freshness-exporter
components:
  - ../_common
replacements:
  - source: {kind: ConfigMap, name: git-revision, fieldPath: data.revision}
    targets:
      - select: {kind: Application}
        fieldPaths:
          - spec.sources.[repoURL=https://github.com/winthebest/shopflow.git].targetRevision
