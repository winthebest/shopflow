# Shared by every profile: the git-revision and platform-params ConfigMaps that the root Application patches.
# The replacements that copy them into the child apps cannot live here: Kustomize runs a Component before the
# profile's top-level `patches` (where Argo CD puts the root app's patches), so they would copy unpatched values.
# Each profile therefore carries its replacements inline (docs/contracts/gitops.md §1b and §4).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - git-revision.yaml
  - platform-params.yaml
