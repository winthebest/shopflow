# Shared by every profile: the git-revision ConfigMap that the root Application patches.
# The replacement that copies it into the child apps cannot live here: Kustomize runs a Component before the
# profile's top-level `patches` (where Argo CD puts the root app's patch), so it would copy the unpatched
# value. Each profile therefore carries the replacements block inline (docs/contracts/gitops.md §4).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - git-revision.yaml
