# Profile `core` (owner: sf-platform): the platform every other profile builds on.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/network-policies
  - ../../apps/gateway-api-crds
  - ../../apps/envoy-gateway
  - ../../apps/cert-manager
  - ../../apps/cnpg
  - ../../apps/shop-db
  - ../../apps/shop
  - ../../apps/cluster-secrets
components:
  - ../_common
# Must stay inline in every profile (see ../_common/kustomization.yaml). Fails the build if an Application
# has no source from this repo, so no app can silently ignore the root app's revision.
replacements:
  - source: {kind: ConfigMap, name: git-revision, fieldPath: data.revision}
    targets:
      - select: {kind: Application}
        fieldPaths:
          - spec.sources.[repoURL=https://github.com/winthebest/shopflow.git].targetRevision
  # shop-db: the backup chain and where to restore from (restore drill, docs/adr/0203). Empty pg.serverName = no
  # backups, the default for every profile set without the cnpg-barman-plugin app (scripts/k3d-up.sh).
  - source:
      kind: ConfigMap
      name: platform-params
      fieldPath: data.[pg.serverName]
    targets:
      - select: {kind: Application, name: shop-db}
        fieldPaths:
          - spec.sources.[path=deploy/charts/shop-db].helm.valuesObject.backup.serverName
        options: {create: true}
  - source:
      kind: ConfigMap
      name: platform-params
      fieldPath: data.[pg.recoveryFrom]
    targets:
      - select: {kind: Application, name: shop-db}
        fieldPaths:
          - spec.sources.[path=deploy/charts/shop-db].helm.valuesObject.recovery.fromServerName
        options: {create: true}
  - source:
      kind: ConfigMap
      name: platform-params
      fieldPath: data.[pg.recoveryTargetTime]
    targets:
      - select: {kind: Application, name: shop-db}
        fieldPaths:
          - spec.sources.[path=deploy/charts/shop-db].helm.valuesObject.recovery.targetTime
        options: {create: true}
