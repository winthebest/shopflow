# In-cluster copy of shop-db-trino-pg (namespace shop, CNPG managed role password, SOPS-encrypted by sf-platform) to
# trino-pg in namespace lakehouse, where Trino reads it (catalog pg: PG_TRINO_USER/PASSWORD). Nothing is copied in git and no age key is
# used (docs/contracts/gitops.md section 5). Runs before Trino on every sync: RBAC in wave -2, the Job in -1.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trino-pg-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trino-pg-copy
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [shop-db-trino-pg]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trino-pg-copy
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trino-pg-copy
subjects:
  - kind: ServiceAccount
    name: trino-pg-copy
    namespace: lakehouse
---
# Kubernetes cannot scope `create` to a name; reading and replacing is limited to the copy.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trino-pg-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [trino-pg]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trino-pg-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trino-pg-copy
subjects:
  - kind: ServiceAccount
    name: trino-pg-copy
    namespace: lakehouse
---
apiVersion: batch/v1
kind: Job
metadata:
  name: trino-pg-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino-pg-copy
        app.kubernetes.io/part-of: shopflow
    spec:
      restartPolicy: Never
      serviceAccountName: trino-pg-copy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["python", "-I", "/scripts/copy-secret.py"]
          env:
            - name: SOURCE_NAMESPACE
              value: shop
            - name: SOURCE_NAME
              value: shop-db-trino-pg
            - name: TARGET_NAMESPACE
              value: lakehouse
            - name: TARGET_NAME
              value: trino-pg
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: trino-pg-copy-script
