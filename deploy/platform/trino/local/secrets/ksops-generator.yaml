# KSOPS exec generator: decrypts this component's Secrets in the Argo CD repo-server at build time.
# Generated by scripts/data-secrets.sh (random values, encrypted in a pipe). `files` resolve from local/.
#   S3 keys (lake, lake_ro), internal shared secret, dbt/exporter logins and their bcrypt password file
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: trino-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets/lake-s3-trino.enc.yaml
  - ./secrets/lake-s3-trino-ro.enc.yaml
  - ./secrets/trino-internal.enc.yaml
  - ./secrets/trino-dbt.enc.yaml
  - ./secrets/trino-exporter.enc.yaml
  - ./secrets/trino-password-db.enc.yaml
