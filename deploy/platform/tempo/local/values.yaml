# Local (k3d) overlay: 2-day retention, small PVC, laptop-sized requests.
tempo:
  retention: 48h
  # Measured on the sf-sre lane cluster: OOMKilled at 512Mi under the soak load (~10 checkouts/s, ~35 spans each).
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {memory: 1Gi}
  # Baseline ~200Mi, but compaction / WAL completion spike to 400–970Mi; at 1Gi alone it was still OOMKilled
  # 3× in 70 minutes. A Go soft limit at ~80% of the cgroup limit makes the GC work harder instead of crossing it.
  extraEnv:
    - name: GOMEMLIMIT
      value: 800MiB
persistence:
  enabled: true
  size: 5Gi
