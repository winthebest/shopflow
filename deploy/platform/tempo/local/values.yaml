# Local (k3d) overlay: 2-day retention, small PVC, laptop-sized requests.
tempo:
  retention: 48h
  # Measured on the sf-sre lane cluster: OOMKilled at 512Mi under the soak load (~10 checkouts/s, ~35 spans each).
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {memory: 1Gi}
persistence:
  enabled: true
  size: 5Gi
