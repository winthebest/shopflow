# Kafka Connect cluster running the CI-built image (docs/adr/0401): no spec.build, so the cluster never needs
# registry credentials or a build pod.
# Worker identity = KafkaUser `debezium` (owns the worker group and internal topics). The Iceberg sink swaps its
# client identity to `iceberg-sink`; the override policy only allows changing security settings (docs/adr/0404).
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: cdc
  namespace: kafka
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.3.1
  replicas: 1
  # Published by data-images.yml (job kafka-connect) for 7a88771; bump tag + digest from that run's summary.
  image: ghcr.io/winthebest/shopflow-kafka-connect:sha-7a88771@sha256:107cd32357346f2e25bf0bb462ab1b218a14c385e09ee1599623178b333d763e
  bootstrapServers: shopflow-kafka-bootstrap:9093
  groupId: cdc-connect
  configStorageTopic: cdc-connect-configs
  offsetStorageTopic: cdc-connect-offsets
  statusStorageTopic: cdc-connect-status
  # Debezium and Connect metrics on port 9404 (rules in metrics.yaml).
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        name: cdc-connect-metrics
        key: metrics-config.yml
  tls:
    trustedCertificates:
      - secretName: shopflow-cluster-ca-cert
        pattern: "*.crt"
  authentication:
    type: scram-sha-512
    username: debezium
    passwordSecret:
      secretName: debezium
      password: password
  config:
    # -1 = broker default.replication.factor (1 locally, 3 on AWS).
    config.storage.replication.factor: -1
    offset.storage.replication.factor: -1
    status.storage.replication.factor: -1
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
    # Connectors may override only security.protocol, sasl.mechanism and sasl.jaas.config.
    connector.client.config.override.policy: Principal
    # ${secrets:<ns>/<name>:<key>} in connector configs is resolved by the worker at task start; Connect stores and
    # shows only the placeholder. Access is granted per Secret in rbac.yaml.
    config.providers: secrets
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider
