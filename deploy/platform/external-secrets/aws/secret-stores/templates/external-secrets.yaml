{{- /*
ExternalSecrets that replace the local KSOPS Secrets on AWS (same names and keys, so workloads do not change).
They land in namespaces other apps create; until those exist the sync fails and Argo CD retries.
*/ -}}
{{- range .Values.secrets }}
{{- if not (has .namespace $.Values.namespaces) }}
{{- fail (printf "secret %s/%s: namespace not in .Values.namespaces (no ClusterSecretStore for it)" .namespace .name) }}
{{- end }}
{{- $param := printf "%s/%s/%s" $.Values.parameterPrefix .namespace .name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/part-of: shopflow
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .refreshInterval | default $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: ssm-{{ .namespace }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    {{- with .type }}
    template:
      type: {{ . }}
      engineVersion: v2
      mergePolicy: Merge
    {{- end }}
  data:
    {{- if .scalarKey }}
    - secretKey: {{ .scalarKey }}
      remoteRef:
        key: {{ $param }}
    {{- else }}
    {{- range .keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $param }}
        property: {{ . }}
    {{- end }}
    {{- end }}
{{- end }}
