{{- /*
One ClusterSecretStore per namespace. `conditions` lets only ExternalSecrets in that namespace use it, and its
role (assumed by the ESO controller through Pod Identity) reads only /shopflow/aws/<namespace>/*. A namespace
therefore cannot reach another namespace's parameters, and only cluster admins can create stores.
*/ -}}
{{- $account := required "accountId (platform param aws.accountId)" .Values.accountId }}
{{- range .Values.namespaces }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ssm-{{ . }}
  labels:
    app.kubernetes.io/part-of: shopflow
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  conditions:
    - namespaces: [{{ . | quote }}]
  provider:
    aws:
      service: ParameterStore
      region: {{ $.Values.region }}
      role: arn:aws:iam::{{ $account }}:role/{{ $.Values.rolePrefix }}{{ . }}
{{- end }}
