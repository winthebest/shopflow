# accountId comes from the session parameter aws.accountId through the Application's helm.valuesObject
# (platform-params, ADR 0206). This placeholder renders for validation but cannot assume any role, so a missing
# parameter fails visibly.
accountId: "000000000000"

# Must match infra/cloud-contract.json (region, roles.eso_prefix, eso_namespaces);
# scripts/cloud-manifests-check.sh fails on drift. Role shopflow-eso-<namespace> reads /shopflow/aws/<namespace>/*.
region: ap-southeast-1
rolePrefix: shopflow-eso-
namespaces: [shop, kafka, lakehouse, airflow, bi, observability]

# ExternalSecrets are not here: each lives in its component's aws overlay, owned by the component owner
# (docs/contracts/gitops.md §1b). scripts/cloud-manifests-check.sh checks every one of them against these stores.
