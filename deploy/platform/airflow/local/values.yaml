# Local (k3d) sizing. The scheduler runs the tasks (LocalExecutor: dbt subprocesses), so it gets the most memory.
scheduler:
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 1536Mi}
  logGroomerSidecar:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 128Mi}
apiServer:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 768Mi}
dagProcessor:
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 768Mi}
  logGroomerSidecar:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 128Mi}
