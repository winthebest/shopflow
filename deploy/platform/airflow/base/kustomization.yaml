# Extra manifests next to the Airflow Helm release (Argo CD multi-source: chart + values + this directory).
# Namespaces are explicit per resource: secret-copy.yaml also grants Roles in namespaces shop and lakehouse.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secret-copy.yaml
  - certificate.yaml
configMapGenerator:
  - name: airflow-secret-copy-script
    namespace: airflow
    files:
      - copy-secret.py
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
