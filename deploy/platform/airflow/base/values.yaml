# Airflow 3, official chart (docs/adr/0414): LocalExecutor (tasks run in the scheduler pod), metadata on CNPG
# (shop-db, database airflow), keys from Secrets fixed outside the chart, the shopflow-airflow image with the DAGs and
# dbt baked in. Argo CD runs the migration and admin Jobs as Sync hooks (no Helm hooks).
useStandardNaming: true
executor: LocalExecutor
airflowVersion: "3.3.2"

images:
  airflow:
    # Published by data-images.yml (job airflow); bump tag + digest from that run's summary.
    repository: ghcr.io/winthebest/shopflow-airflow
    tag: sha-5b24dbe
    digest: sha256:8a4090a7e9e60f158937472e7c4acf2b2222dd8873d1fcd6be648085e71e81df
    pullPolicy: IfNotPresent

# Copied in the cluster from shop/shop-db-airflow with the key `connection` (base/secret-copy.yaml).
data:
  metadataSecretName: airflow-metadata

# One Secret (scripts/data-secrets.sh) holds the three keys the chart would otherwise generate on install: a
# generated Fernet key would make a restored metadata database unreadable.
fernetKeySecretName: airflow-keys
apiSecretKeySecretName: airflow-keys
jwtSecretName: airflow-keys

postgresql:
  enabled: false
redis:
  enabled: false
pgbouncer:
  enabled: false
statsd:
  enabled: false
# No deferrable operators here.
triggerer:
  enabled: false
dagProcessor:
  enabled: true
networkPolicies:
  enabled: false  # NetworkPolicies are sf-platform's (deploy/platform/network-policies)

# Every Airflow container: dbt's Trino login and CA (data/dbt/profiles.yml). Tasks run in the scheduler.
secret:
  - envName: DBT_TRINO_USER
    secretName: trino-dbt
    secretKey: username
  - envName: DBT_TRINO_PASSWORD
    secretName: trino-dbt
    secretKey: password
env:
  - name: TRINO_HOST
    value: trino.lakehouse.svc
  - name: TRINO_PORT
    value: "8443"
  - name: TRINO_CA_FILE
    value: /etc/trino-ca/ca.crt
volumes:
  - name: trino-ca
    secret:
      secretName: airflow-trino-ca
      items:
        - key: ca.crt
          path: ca.crt
volumeMounts:
  - name: trino-ca
    mountPath: /etc/trino-ca
    readOnly: true

securityContexts:
  pod:
    runAsNonRoot: true
    runAsUser: 50000
    runAsGroup: 0
    fsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  containers:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

config:
  core:
    load_examples: "False"
    # LocalExecutor: at most this many task subprocesses (each a dbt process) in the scheduler pod.
    parallelism: "4"
  dag_processor:
    parsing_processes: "1"

migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

# Admin login from Secret airflow-admin (scripts/data-secrets.sh), created on deploy: the UI never starts without one.
# Wave 1: after the migration hook (wave 0) has created the schema.
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
  env:
    - name: ADMIN_USERNAME
      valueFrom:
        secretKeyRef: {name: airflow-admin, key: username}
    - name: ADMIN_PASSWORD
      valueFrom:
        secretKeyRef: {name: airflow-admin, key: password}
  args:
    - bash
    - -c
    - >-
      airflow users create --role Admin --username "$ADMIN_USERNAME" --password "$ADMIN_PASSWORD"
      --email admin@shopflow.local --firstname Admin --lastname Shopflow
      || airflow users list --output plain | grep -qw "$ADMIN_USERNAME"
