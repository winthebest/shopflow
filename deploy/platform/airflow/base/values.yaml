# Airflow 3, official chart (docs/adr/0414): LocalExecutor (tasks run in the scheduler pod), metadata on CNPG
# (shop-db, database airflow), keys from Secrets fixed outside the chart, the shopflow-airflow image with the DAGs and
# dbt baked in. Argo CD runs the migration and admin Jobs as Sync hooks (no Helm hooks).
useStandardNaming: true
executor: LocalExecutor
airflowVersion: "3.3.2"

images:
  airflow:
    # Published by data-images.yml (job airflow); bump tag + digest from that run's summary.
    repository: ghcr.io/winthebest/shopflow-airflow
    tag: sha-4913f2d
    digest: sha256:0a2b4ded4d9be251af61b1fefc1366bcdf773a3f6b514d08656071da147f79b3
    pullPolicy: IfNotPresent

# Copied in the cluster from shop/shop-db-airflow with the key `connection` (base/secret-copy.yaml).
data:
  metadataSecretName: airflow-metadata

# One Secret (scripts/data-secrets.sh) holds the three keys the chart would otherwise generate on install: a
# generated Fernet key would make a restored metadata database unreadable.
fernetKeySecretName: airflow-keys
apiSecretKeySecretName: airflow-keys
jwtSecretName: airflow-keys

postgresql:
  enabled: false
redis:
  enabled: false
pgbouncer:
  enabled: false
statsd:
  enabled: false
# No deferrable operators here.
triggerer:
  enabled: false
dagProcessor:
  enabled: true
networkPolicies:
  enabled: false  # NetworkPolicies are sf-platform's (deploy/platform/network-policies)

# Every Airflow container: dbt's Trino login and CA (data/dbt/profiles.yml). Tasks run in the scheduler.
secret:
  - envName: DBT_TRINO_USER
    secretName: trino-dbt
    secretKey: username
  - envName: DBT_TRINO_PASSWORD
    secretName: trino-dbt
    secretKey: password
env:
  - name: TRINO_HOST
    value: trino.lakehouse.svc
  - name: TRINO_PORT
    value: "8443"
  - name: TRINO_CA_FILE
    value: /etc/trino-ca/ca.crt
volumes:
  - name: trino-ca
    secret:
      secretName: airflow-trino-ca
      items:
        - key: ca.crt
          path: ca.crt
volumeMounts:
  - name: trino-ca
    mountPath: /etc/trino-ca
    readOnly: true

securityContexts:
  pod:
    runAsNonRoot: true
    runAsUser: 50000
    runAsGroup: 0
    fsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  containers:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

config:
  core:
    load_examples: "False"
    # Every cluster is new, so every DAG is "created" at startup; with Airflow's default (paused) dbt_build never ran
    # and the gold-freshness SLI would count bad minutes after its 2-hour warm-up (batch slot 2026-10-10).
    dags_are_paused_at_creation: "False"
    # LocalExecutor: at most this many task subprocesses (each a dbt process) in the scheduler pod.
    parallelism: "4"
  dag_processor:
    parsing_processes: "1"

migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  # After the migration, grant what shop-db's monitoring query airflow_dag_run reads
  # (deploy/charts/shop-db/templates/monitoring-queries.yaml; the input of alert AirflowDagRunFailed): pg_monitor, which
  # the CNPG exporter runs as, may read dag_run's dag_id, state and end_date.
  # The tables belong to airflow, so the grant runs as airflow through Airflow's own engine; GRANT is idempotent and
  # every migrate reapplies it. Widen it here before the query reads another column.
  args:
    - bash
    - -c
    - |
      set -e
      airflow db migrate
      exec python - <<'EOF'
      from airflow import settings
      from sqlalchemy import text
      if settings.engine is None:
          settings.configure_orm()
      with settings.engine.begin() as conn:
          conn.execute(text("GRANT SELECT (dag_id, state, end_date) ON public.dag_run TO pg_monitor"))
      print("dag_run: SELECT (dag_id, state, end_date) granted to pg_monitor")
      EOF

# Admin login from Secret airflow-admin (scripts/data-secrets.sh), created on deploy: the UI never starts without one.
# Wave 1: after the migration hook (wave 0) has created the schema.
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
  env:
    - name: ADMIN_USERNAME
      valueFrom:
        secretKeyRef: {name: airflow-admin, key: username}
    - name: ADMIN_PASSWORD
      valueFrom:
        secretKeyRef: {name: airflow-admin, key: password}
  args:
    - bash
    - -c
    - >-
      airflow users create --role Admin --username "$ADMIN_USERNAME" --password "$ADMIN_PASSWORD"
      --email admin@shopflow.local --firstname Admin --lastname Shopflow
      || airflow users list --output plain | grep -qw "$ADMIN_USERNAME"
