# In-cluster copies Airflow reads from its own namespace (docs/contracts/gitops.md section 5; no second copy in git,
# no age key):
#   shop/shop-db-airflow (CNPG managed role `airflow`, SOPS by sf-platform) -> airflow/airflow-metadata, plus the key
#     `connection` (SQLAlchemy URI) that the chart's data.metadataSecretName expects;
#   lakehouse/trino-dbt (Trino login of dbt, scripts/data-secrets.sh) -> airflow/trino-dbt.
# Runs before the chart's migration Job on every sync: RBAC in wave -2, the Job in -1.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-secret-copy
  namespace: airflow
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-secret-copy
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [shop-db-airflow]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-secret-copy
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-secret-copy
subjects:
  - kind: ServiceAccount
    name: airflow-secret-copy
    namespace: airflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-secret-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [trino-dbt]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-secret-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-secret-copy
subjects:
  - kind: ServiceAccount
    name: airflow-secret-copy
    namespace: airflow
---
# Kubernetes cannot scope `create` to a name; reading and replacing is limited to the copies.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-secret-copy
  namespace: airflow
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [airflow-metadata, trino-dbt]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-secret-copy
  namespace: airflow
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-secret-copy
subjects:
  - kind: ServiceAccount
    name: airflow-secret-copy
    namespace: airflow
---
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-secret-copy
  namespace: airflow
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow-secret-copy
        app.kubernetes.io/part-of: shopflow
    spec:
      restartPolicy: Never
      serviceAccountName: airflow-secret-copy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metadata
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["python", "-I", "/scripts/copy-secret.py"]
          env:
            - name: SOURCE_NAMESPACE
              value: shop
            - name: SOURCE_NAME
              value: shop-db-airflow
            - name: TARGET_NAMESPACE
              value: airflow
            - name: TARGET_NAME
              value: airflow-metadata
            - name: DERIVED_DATA
              value: '{"connection": "postgresql://{username}:{password}@shop-db-rw.shop.svc:5432/airflow?sslmode=require"}'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
        - name: trino-dbt
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["python", "-I", "/scripts/copy-secret.py"]
          env:
            - name: SOURCE_NAMESPACE
              value: lakehouse
            - name: SOURCE_NAME
              value: trino-dbt
            - name: TARGET_NAMESPACE
              value: airflow
            - name: TARGET_NAME
              value: trino-dbt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: airflow-secret-copy-script
