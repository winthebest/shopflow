# Trust anchor for dbt's HTTPS connection to Trino (TRINO_CA_FILE): any certificate from the internal CA carries the
# CA certificate in its `ca.crt` key, so this namespace gets it without reading another namespace's Secret. The
# leaf certificate itself is unused.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: airflow-trino-ca
  namespace: airflow
spec:
  secretName: airflow-trino-ca
  dnsNames:
    - airflow-trino-ca.airflow.svc
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: shopflow-ca
