# Helm repository index for the Airflow chart, served from this repo (raw.githubusercontent.com) for app airflow.
# The official index (https://airflow.apache.org/index.yaml) points 1.22.0 at archive.apache.org, and from the local
# network that host does not even accept TCP connections (the Argo CD repo-server timed out, rt/batch slots
# 2026-10-10); dlcdn.apache.org, Apache's CDN for the same release tree, serves it in under a second.
# The entry is the official one with only `urls` changed. Its digest (sha256) matches the dlcdn file, whose sha512
# matches the release's .sha512. To bump: copy the new version's entry from the official index, point urls at
# https://dlcdn.apache.org/airflow/helm-chart/<version>/airflow-<version>.tgz, check both sums. dlcdn keeps only
# current releases, so an old pin there disappears once Airflow publishes a newer chart.
