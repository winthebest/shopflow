# KSOPS exec generator: decrypts this component's Secrets in the Argo CD repo-server at build time.
# Generated by scripts/data-secrets.sh (random values, encrypted in a pipe). `files` resolve from local/.
#   flink-s3: SeaweedFS identity `flink` (read/write below lake/flink-ckpt/ only), part of the lakehouse group
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: flink-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets/flink-s3.enc.yaml
