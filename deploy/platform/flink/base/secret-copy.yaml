# In-cluster copies the KPI job reads from its own namespace (docs/contracts/gitops.md section 5; no second copy in git,
# no age key):
#   kafka/flink (Strimzi KafkaUser: SCRAM password)          -> flink/flink-kafka
#   kafka/shopflow-cluster-ca-cert (Kafka cluster CA)         -> flink/kafka-cluster-ca
#   kafka/cdc-epoch (current CDC epoch, scripts/cdc-epoch.sh) -> flink/cdc-epoch
#   shop/shop-db-flink-serving (CNPG role flink_serving)      -> flink/flink-serving
#   shop/shop-db-grafana-serving (read-only role)             -> observability/grafana-serving-datasource: a Grafana
#     provisioning file (key serving.yaml, label grafana_datasource=1) the sidecar loads once, complete. The password
#     goes in as a JSON string (DERIVED_ENCODING=json); the Secret holds no other key. Argo CD does not manage it, so
#     it stays when profile rt is removed (a read-only datasource, harmless).
# Runs on every sync before the DDL Job and the FlinkDeployment: RBAC in wave -2, the Job in -1. A new CDC epoch
# deletes the FlinkDeployment (scripts/cdc-epoch.sh new); the sync that recreates it copies the new epoch first.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-secret-copy
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-secret-copy
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [flink, shopflow-cluster-ca-cert, cdc-epoch]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-secret-copy
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink-secret-copy
subjects:
  - kind: ServiceAccount
    name: flink-secret-copy
    namespace: flink
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-secret-copy
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [shop-db-flink-serving, shop-db-grafana-serving]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-secret-copy
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink-secret-copy
subjects:
  - kind: ServiceAccount
    name: flink-secret-copy
    namespace: flink
---
# Kubernetes cannot scope `create` to a name; reading and replacing is limited to the copies.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-secret-copy
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [flink-kafka, kafka-cluster-ca, cdc-epoch, flink-serving]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-secret-copy
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink-secret-copy
subjects:
  - kind: ServiceAccount
    name: flink-secret-copy
    namespace: flink
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-secret-copy
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [grafana-serving-datasource]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-secret-copy
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink-secret-copy
subjects:
  - kind: ServiceAccount
    name: flink-secret-copy
    namespace: flink
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flink-secret-copy
  namespace: flink
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flink-secret-copy
        app.kubernetes.io/part-of: shopflow
    spec:
      restartPolicy: Never
      serviceAccountName: flink-secret-copy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-login
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["python", "-I", "/scripts/copy-secret.py"]
          env:
            - name: SOURCE_NAMESPACE
              value: kafka
            - name: SOURCE_NAME
              value: flink
            - name: TARGET_NAMESPACE
              value: flink
            - name: TARGET_NAME
              value: flink-kafka
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
        - name: kafka-ca
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["python", "-I", "/scripts/copy-secret.py"]
          env:
            - name: SOURCE_NAMESPACE
              value: kafka
            - name: SOURCE_NAME
              value: shopflow-cluster-ca-cert
            - name: TARGET_NAMESPACE
              value: flink
            - name: TARGET_NAME
              value: kafka-cluster-ca
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
        - name: cdc-epoch
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["python", "-I", "/scripts/copy-secret.py"]
          env:
            - name: SOURCE_NAMESPACE
              value: kafka
            - name: SOURCE_NAME
              value: cdc-epoch
            - name: TARGET_NAMESPACE
              value: flink
            - name: TARGET_NAME
              value: cdc-epoch
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
        - name: serving-login
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["python", "-I", "/scripts/copy-secret.py"]
          env:
            - name: SOURCE_NAMESPACE
              value: shop
            - name: SOURCE_NAME
              value: shop-db-flink-serving
            - name: TARGET_NAMESPACE
              value: flink
            - name: TARGET_NAME
              value: flink-serving
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
        - name: grafana-datasource
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["python", "-I", "/scripts/copy-secret.py"]
          env:
            - name: SOURCE_NAMESPACE
              value: shop
            - name: SOURCE_NAME
              value: shop-db-grafana-serving
            - name: TARGET_NAMESPACE
              value: observability
            - name: TARGET_NAME
              value: grafana-serving-datasource
            - name: COPY_SOURCE_KEYS
              value: "false"
            - name: DERIVED_ENCODING
              value: json
            - name: TARGET_LABELS
              value: '{"grafana_datasource": "1", "app.kubernetes.io/part-of": "shopflow"}'
            - name: DERIVED_DATA
              value: '{"serving.yaml": "apiVersion: 1\ndatasources:\n  - name: KPI serving\n    uid: serving\n    type: grafana-postgresql-datasource\n    access: proxy\n    url: shop-db-rw.shop.svc:5432\n    user: {username}\n    editable: false\n    jsonData:\n      database: serving\n      sslmode: require\n      postgresVersion: 1700\n    secureJsonData:\n      password: {password}\n"}'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: flink-secret-copy-script
