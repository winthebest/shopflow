# The realtime KPI job (docs/adr/0415): application mode, SqlRunner runs data/flink/kpi_minute.sql (baked into the
# image) as one job. Kafka over SASL_SSL/SCRAM as `flink`, serving.kpi_minute as flink_serving, checkpoints and HA
# state on SeaweedFS below lake/flink-ckpt/ (identity `flink`, scripts/data-secrets.sh). Credentials reach the pods
# as environment variables from Secrets, never through the Flink configuration (a ConfigMap): the S3A plugin's
# default credential chain reads AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: kpi-minute
  namespace: flink
  labels:
    app.kubernetes.io/part-of: shopflow
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Published by data-images.yml (job flink); bump tag + digest from that run's summary.
  image: ghcr.io/winthebest/shopflow-flink:sha-1a7a7f7@sha256:d1841cfcea22383aebabe425f589e923a640cd1ee88e643bc03c2f81956a8d2f
  imagePullPolicy: IfNotPresent
  flinkVersion: v2_2
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "1"
    execution.checkpointing.interval: 60s
    execution.checkpointing.min-pause: 10s
    execution.checkpointing.num-retained: "2"
    state.backend.type: hashmap
    # The operator's webhook refuses upgradeMode last-state without a checkpoint directory here. This is the base;
    # the job narrows it to s3://lake/flink-ckpt/<epoch> (SET in kpi_minute.sql), so epochs never share checkpoints.
    # HA state lets the operator resume from the latest checkpoint after an upgrade or a restart.
    execution.checkpointing.dir: s3://lake/flink-ckpt
    high-availability.type: kubernetes
    high-availability.storageDir: s3://lake/flink-ckpt/ha
    s3.endpoint: http://seaweedfs.lakehouse.svc:8333
    # Flink 2 reads its configuration as nested YAML, so no key may be a prefix of another: `s3.endpoint` and
    # `s3.endpoint.region` cannot both exist. The S3 plugin maps s3., s3a. and fs.s3a. alike to Hadoop's fs.s3a.
    s3a.endpoint.region: us-east-1
    s3.path.style.access: "true"
  podTemplate:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flink-main-container
          env:
            - name: CDC_EPOCH
              valueFrom: {secretKeyRef: {name: cdc-epoch, key: epoch}}
            - name: KAFKA_USER
              value: flink
            - name: KAFKA_PASSWORD
              valueFrom: {secretKeyRef: {name: flink-kafka, key: password}}
            - name: SERVING_USER
              valueFrom: {secretKeyRef: {name: flink-serving, key: username}}
            - name: SERVING_PASSWORD
              valueFrom: {secretKeyRef: {name: flink-serving, key: password}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: flink-s3, key: access-key-id}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: flink-s3, key: secret-access-key}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/kafka-ca
              readOnly: true
      volumes:
        - name: kafka-ca
          secret:
            secretName: kafka-cluster-ca
            items:
              - key: ca.crt
                path: ca.crt
  jobManager:
    resource:
      memory: 1024m
      cpu: 0.5
  taskManager:
    resource:
      memory: 1024m
      cpu: 0.5
  job:
    jarURI: local:///opt/flink/usrlib/sql-runner.jar
    entryClass: io.shopflow.flink.SqlRunner
    args: [/opt/flink/sql/kpi_minute.sql]
    parallelism: 1
    upgradeMode: last-state
    state: running
