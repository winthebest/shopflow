# Log agent (DaemonSet). Tails /var/log/pods with the filelog receiver, parses the JSON log contract
# (docs/contracts/services.md: timestamp, level, message, service, trace_id, span_id), attaches the trace
# context so Grafana can jump log ↔ trace, and ships to Loki's native OTLP endpoint.
mode: daemonset
fullnameOverride: otel-agent

image:
  repository: otel/opentelemetry-collector-k8s
  tag: "0.161.0"
  digest: sha256:2fed8ff024bdb42473890724fa0833bd31e16197aa4790d8e0be3829f87f0de1
command:
  name: otelcol-k8s

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: true

# Logs only: no OTLP/Jaeger/Zipkin listeners (and no hostPorts) on the nodes.
ports:
  otlp: {enabled: false}
  otlp-http: {enabled: false}
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}

resources:
  requests: {cpu: 25m, memory: 64Mi}
  limits: {memory: 192Mi}

config:
  receivers:
    otlp: null
    jaeger: null
    zipkin: null
    prometheus: null
    file_log:
      operators:
        # CRI/docker line format + k8s.* resource attributes from the log path.
        - type: container
          id: container-parser
          max_log_size: 102400
        # JSON lines only (the shop services); other pods keep the raw line as body.
        - type: json_parser
          id: app-json
          if: 'body matches "^\\s*\\{"'
          parse_from: body
          parse_to: attributes
          on_error: send_quiet
          severity:
            parse_from: attributes.level
            mapping:
              warn: [WARNING, WARN]
        - type: trace_parser
          if: 'attributes.trace_id != nil and attributes.trace_id != ""'
          trace_id: {parse_from: attributes.trace_id}
          span_id: {parse_from: attributes.span_id}
          on_error: send_quiet
        - type: remove
          if: 'attributes.trace_id != nil'
          field: attributes.trace_id
        - type: remove
          if: 'attributes.span_id != nil'
          field: attributes.span_id
        - type: move
          if: 'attributes.message != nil'
          from: attributes.message
          to: body
  processors:
    k8s_attributes:
      extract:
        # No service.* here: service.name comes only from the label below (then the fallback), so the
        # Loki label service_name is deterministic.
        metadata: [k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.node.name, k8s.deployment.name,
                   k8s.statefulset.name, k8s.daemonset.name, k8s.job.name]
        labels:
          - tag_name: service.name
            key: app.kubernetes.io/name
            from: pod
    # Pods without app.kubernetes.io/name still get a service.name (Loki index label service_name).
    transform/service-name:
      log_statements:
        - context: resource
          statements:
            - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil
  exporters:
    otlp_http/loki:
      # The exporter appends /v1/logs → Loki endpoint /otlp/v1/logs.
      endpoint: http://loki.observability.svc:3100/otlp
      tls: {insecure: true}
  service:
    pipelines:
      traces: null
      metrics: null
      logs:
        receivers: [file_log]
        processors: [memory_limiter, k8s_attributes, transform/service-name, batch]
        exporters: [otlp_http/loki]
