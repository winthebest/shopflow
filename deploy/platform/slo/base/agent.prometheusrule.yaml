# Operator agent, demo deployment (metric names and labels: agent/instruments.py; SLOs: slo/agent.yaml,
# docs/slo/agent.md). Only agent_mode="demo" reaches this Prometheus: eval runs export to the lab Collector, and their
# results are the scorer's report. Runbooks: docs/runbooks/agent-unsafe-action.md, agent-task-latency.md,
# agent-task-cost.md.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent
  namespace: observability
  labels:
    app.kubernetes.io/part-of: shopflow
spec:
  groups:
    - name: shopflow-agent
      rules:
        # An unsafe change was EXECUTED: no valid approval, or an effect beyond the approved bounds. Its budget is
        # zero, so this is a page on any one, not an SLO (a burn rate over a zero budget divides by zero). A proposal
        # the guard blocked is agent_tasks_total{agent_outcome="blocked"} and never pages.
        # The agent starts the counter at 0 only for the action classes of the guard's allowlist; an unsafe action of
        # any other class first appears already at 1, where increase() sees no change. The second branch pages on a
        # series that is new within the window and already above 0. Either way the page stays up for 15 minutes.
        - alert: AgentUnsafeActionExecuted
          expr: |
            sum by (agent_arm, agent_action_class) (increase(agent_unsafe_actions_total{agent_mode="demo"}[15m])) > 0
            or
            sum by (agent_arm, agent_action_class) (
              agent_unsafe_actions_total{agent_mode="demo"}
              unless agent_unsafe_actions_total{agent_mode="demo"} offset 15m
            ) > 0
          labels:
            severity: page
            team: sf-sre
          annotations:
            summary: "The agent ({{ $labels.agent_arm }} arm) executed an unsafe {{ $labels.agent_action_class }} change: stop the agent and check what it changed."
            runbook_url: https://github.com/winthebest/shopflow/blob/main/docs/runbooks/agent-unsafe-action.md
        # The SLOs' tickets (slo/agent.yaml has no Sloth alerts). A few dozen demo tasks a day at most: a 5m or 1h burn
        # rate would turn one slow task into a page, so only the ticket windows, each with enough tasks for a share to
        # mean something. Over the last day more than 15% of tasks bad (3x the 5% budget) with at least 10 tasks, or
        # over 3 days more than 5% (1x) with at least 30.
        - alert: AgentTaskLatencyBudgetBurn
          expr: |
            max without (sloth_window) (
              (
                slo:sli_error:ratio_rate1d{sloth_id="agent-task-latency"} > 3 * 0.05
                and on () sum(increase(agent_task_duration_seconds_count{agent_mode="demo",gen_ai_request_model="claude-opus-5-5"}[1d])) >= 10
              )
              or
              (
                slo:sli_error:ratio_rate3d{sloth_id="agent-task-latency"} > 0.05
                and on () sum(increase(agent_task_duration_seconds_count{agent_mode="demo",gen_ai_request_model="claude-opus-5-5"}[3d])) >= 30
              )
            )
          labels:
            severity: ticket
            team: sf-sre
          annotations:
            summary: "{{ $value | humanizePercentage }} of claude-opus-5-5 demo tasks took more than 120 s; the task-latency SLO allows 5%."
            runbook_url: https://github.com/winthebest/shopflow/blob/main/docs/runbooks/agent-task-latency.md
        - alert: AgentTaskCostBudgetBurn
          expr: |
            max without (sloth_window) (
              (
                slo:sli_error:ratio_rate1d{sloth_id="agent-task-cost"} > 3 * 0.05
                and on () sum(increase(agent_task_cost_usd_count{agent_mode="demo",gen_ai_request_model="claude-opus-5-5"}[1d])) >= 10
              )
              or
              (
                slo:sli_error:ratio_rate3d{sloth_id="agent-task-cost"} > 0.05
                and on () sum(increase(agent_task_cost_usd_count{agent_mode="demo",gen_ai_request_model="claude-opus-5-5"}[3d])) >= 30
              )
            )
          labels:
            severity: ticket
            team: sf-sre
          annotations:
            summary: "{{ $value | humanizePercentage }} of claude-opus-5-5 demo tasks cost more than $0.40; the task-cost SLO allows 5%."
            runbook_url: https://github.com/winthebest/shopflow/blob/main/docs/runbooks/agent-task-cost.md
