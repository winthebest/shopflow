# In-cluster copy of shop-db-polaris (namespace shop, CNPG managed role password, SOPS-encrypted by sf-platform) to
# polaris-db in namespace lakehouse, where Polaris reads it (persistence.relationalJdbc.secret). Nothing is copied in git and no age key is
# used (docs/contracts/gitops.md section 5). Runs before Polaris on every sync: RBAC in wave -2, the Job in -1.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: polaris-db-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: polaris-db-copy
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [shop-db-polaris]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: polaris-db-copy
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: polaris-db-copy
subjects:
  - kind: ServiceAccount
    name: polaris-db-copy
    namespace: lakehouse
---
# Kubernetes cannot scope `create` to a name; reading and replacing is limited to the copy.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: polaris-db-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [polaris-db]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: polaris-db-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: polaris-db-copy
subjects:
  - kind: ServiceAccount
    name: polaris-db-copy
    namespace: lakehouse
---
apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-db-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polaris-db-copy
        app.kubernetes.io/part-of: shopflow
    spec:
      restartPolicy: Never
      serviceAccountName: polaris-db-copy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["python", "-I", "/scripts/copy-secret.py"]
          env:
            - name: SOURCE_NAMESPACE
              value: shop
            - name: SOURCE_NAME
              value: shop-db-polaris
            - name: TARGET_NAMESPACE
              value: lakehouse
            - name: TARGET_NAME
              value: polaris-db
            # The chart reads the JDBC URL from the same Secret (key jdbcUrl).
            - name: EXTRA_DATA
              value: '{"jdbcUrl": "jdbc:postgresql://shop-db-rw.shop.svc:5432/catalog?sslmode=require"}'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: polaris-db-copy-script
