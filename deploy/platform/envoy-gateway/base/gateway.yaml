# The single public entry point. Only routes from namespace `shop` may attach (docs/contracts/services.md);
# admin UIs never get a route (docs/adr/0205-admin-ui-port-forward-only.md).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: shopflow
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          image: docker.io/envoyproxy/envoy:distroless-v1.39.1@sha256:eb2c01c13125d1629637cb4e4cce7207009fb7cc2c8027f9742758549d15b6f4
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      envoyService:
        type: LoadBalancer
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: shopflow
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: shopflow
    namespace: envoy-gateway-system
---
# TLS: cert-manager's Gateway API support issues `shop-tls` from the annotated ClusterIssuer for the listener
# hostname (set per environment in the overlay).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shopflow
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: shopflow-ca
spec:
  gatewayClassName: shopflow
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          # group/kind spelled out: the API server defaults them, and Argo CD would otherwise report a diff.
          - group: ""
            kind: Secret
            name: shop-tls
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: shop
