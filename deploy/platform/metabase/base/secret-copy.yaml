# In-cluster copies Metabase reads from its own namespace (docs/contracts/gitops.md section 5; no second copy in git,
# no age key):
#   shop/shop-db-metabase (CNPG managed role `metabase`, SOPS by sf-platform) -> metabase/metabase-db, key
#     `connection-uri` (MB_DB_CONNECTION_URI of the application database);
#   lakehouse/trino-metabase (Trino login of metabase, scripts/data-secrets.sh) -> metabase/trino-metabase.
# Runs before Metabase on every sync: RBAC in wave -2, the Job in -1. Each copy waits up to 5 minutes for its source
# Secret (wait-for-source.sh): on a cluster's first sync the sources may not exist yet.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metabase-secret-copy
  namespace: metabase
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metabase-secret-copy
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [shop-db-metabase]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metabase-secret-copy
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metabase-secret-copy
subjects:
  - kind: ServiceAccount
    name: metabase-secret-copy
    namespace: metabase
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metabase-secret-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [trino-metabase]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metabase-secret-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metabase-secret-copy
subjects:
  - kind: ServiceAccount
    name: metabase-secret-copy
    namespace: metabase
---
# Kubernetes cannot scope `create` to a name; reading and replacing is limited to the copies.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metabase-secret-copy
  namespace: metabase
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [metabase-db, trino-metabase]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metabase-secret-copy
  namespace: metabase
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metabase-secret-copy
subjects:
  - kind: ServiceAccount
    name: metabase-secret-copy
    namespace: metabase
---
apiVersion: batch/v1
kind: Job
metadata:
  name: metabase-secret-copy
  namespace: metabase
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metabase-secret-copy
        app.kubernetes.io/part-of: shopflow
    spec:
      restartPolicy: Never
      serviceAccountName: metabase-secret-copy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app-db
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["sh", "/scripts/wait-for-source.sh"]
          env:
            - name: SOURCE_NAMESPACE
              value: shop
            - name: SOURCE_NAME
              value: shop-db-metabase
            - name: TARGET_NAMESPACE
              value: metabase
            - name: TARGET_NAME
              value: metabase-db
            - name: DERIVED_DATA
              value: '{"connection-uri": "postgres://shop-db-rw.shop.svc:5432/metabase?user={username}&password={password}&sslmode=require"}'
            - name: COPY_SOURCE_KEYS
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
        - name: trino-metabase
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["sh", "/scripts/wait-for-source.sh"]
          env:
            - name: SOURCE_NAMESPACE
              value: lakehouse
            - name: SOURCE_NAME
              value: trino-metabase
            - name: TARGET_NAMESPACE
              value: metabase
            - name: TARGET_NAME
              value: trino-metabase
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: metabase-secret-copy-script
