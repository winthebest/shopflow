# KEDA: scales fulfillment-worker on Kafka consumer lag (Phase 7; docs/adr/0304-keda-kafka-lag.md). Always on with
# profile `ops`. Same on k3d and EKS, so there is no local/aws overlay. Images by digest (tag@digest).
image:
  keda:
    tag: "2.21.0@sha256:81fe6547ce8d1cc29273f887b76507e9b853e5bc1f875ec23fe60061a38ed809"
  metricsApiServer:
    tag: "2.21.0@sha256:255375037fe592732eeb554743aae360c2da88cf0b9b1258d0a987ef885f0881"
  webhooks:
    tag: "2.21.0@sha256:e1969628cca6123e32eea13c47c75817091af2657fa68d9d0d58a8620d1b75b1"
  pullPolicy: IfNotPresent

# Certificates from cert-manager (core profile), like Chaos Mesh: the operator then neither generates nor patches
# them at runtime, and the Secret has a declared source. cainjector writes the caBundle (ignored by Argo CD).
certificates:
  autoGenerated: false
  certManager:
    enabled: true
    issuer:
      generate: true
      name: keda-ca
      kind: Issuer

# Lab sizing (one small ScaledObject); measure on the first slot and adjust.
resources:
  operator:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
  metricServer:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
  webhooks:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
