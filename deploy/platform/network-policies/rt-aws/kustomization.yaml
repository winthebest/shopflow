# AWS variant of the flink policies: API server egress on 443 to the VPC (components/apiserver-aws), and S3 + Glue +
# Pod Identity for the KPI job (aws-storage.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../rt
  - aws-storage.yaml
components:
  - ../components/apiserver-aws
