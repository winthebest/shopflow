# Profile batch: namespace airflow (docs/adr/0208-psa-and-network-policies.md, flows: docs/contracts/environment.md
# "Network flows"). Airflow 3 with LocalExecutor (scheduler, API server, DAG processor, migration/admin/copy Jobs).
# baseline until a server-side dry-run of the rendered chart confirms restricted (warn/audit show the gap).
apiVersion: v1
kind: Namespace
metadata:
  name: airflow
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: airflow
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: airflow
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# Airflow components of one namespace trust each other (scheduler, API server, DAG processor, Jobs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: airflow
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# Contract flows: metadata DB on shop-db, dbt/maintenance/reconciliation on Trino, OTLP to the collector; Prometheus
# may scrape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: airflow-flows
  namespace: airflow
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: shop}
          podSelector:
            matchLabels: {cnpg.io/cluster: shop-db}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: lakehouse}
          podSelector:
            matchLabels: {app.kubernetes.io/name: trino}
      ports:
        - {protocol: TCP, port: 8443}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/instance: otel-gateway}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
---
# The secret copy Jobs read Secrets of other namespaces through the API server (gitops.md §5).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apiserver
  namespace: airflow
  labels:
    shopflow.io/egress: apiserver
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # API server only: k3s matches egress after the Service DNAT (kubernetes.default -> node IP:6443), so 443 stays
    # closed. The aws overlay swaps this rule for 443 to the VPC (components/apiserver-aws).
    - ports:
        - {protocol: TCP, port: 6443}
