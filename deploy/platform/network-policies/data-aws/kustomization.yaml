# AWS variant of the kafka/lakehouse policies: API server egress on 443 to the VPC (components/apiserver-aws), and
# S3 + Glue + Pod Identity for the Iceberg sink and Trino (aws-storage.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../data
  - aws-storage.yaml
components:
  - ../components/apiserver-aws
