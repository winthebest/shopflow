# Namespaces of the core profile with their Pod Security level (docs/adr/0208-psa-and-network-policies.md).
# Created here at wave -2, before any pod, so admission enforces the level from the first pod on. Components keep
# CreateNamespace=true; Argo CD never deletes or prunes these objects (deleting a namespace deletes its contents).
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
