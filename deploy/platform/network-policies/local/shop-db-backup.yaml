# Local only (restore drill, profile drill or data; docs/contracts/environment.md "Network flows"): the barman-cloud
# plugin in the shop-db pods archives WAL and base backups to SeaweedFS (bucket pg-backup). On AWS backups go to S3
# (aws/shop-db-backup.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-db-backup
  namespace: shop
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: shop-db}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: lakehouse}
          podSelector:
            matchLabels: {app.kubernetes.io/name: seaweedfs}
      ports:
        - {protocol: TCP, port: 8333}
