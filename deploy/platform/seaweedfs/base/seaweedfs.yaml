# SeaweedFS as the local S3 endpoint for the lake (docs/adr/0409). `weed mini` runs master, volume, filer and the
# S3 gateway in one process: the smallest footprint that still speaks the S3 API Iceberg needs.
# Only S3 (8333) is exposed as a Service; WebDAV, admin UI, telemetry and the built-in Iceberg catalog are off.
#
# S3 identities come from Secret seaweedfs-s3-config (key s3.json, SOPS-managed). One identity per client:
#   polaris        Read, List, Write on lake  (catalog writes table metadata)
#   iceberg-sink   Read, List, Write on lake  (bronze data files)
#   trino-lake     Read, List, Write on lake  (dbt: silver/gold; maintenance procedures)
#   trino-lake-ro  Read, List on lake         (lake_ro: exporter, metabase, planner; cannot delete files)
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  replicas: 1
  # One writer on a ReadWriteOnce volume: stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/part-of: shopflow
    spec:
      securityContext:
        # Non-root from the start (the image's entrypoint only drops privileges when started as root).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          args:
            - mini
            - -dir=/data
            - -s3.config=/etc/seaweedfs/s3.json
            - -bucket=lake
            - -s3.port.iceberg=0
            - -webdav=false
            - -admin.ui=false
            - -master.telemetry=false
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        - name: s3-config
          secret:
            secretName: seaweedfs-s3-config
        - name: tmp
          emptyDir: {}
