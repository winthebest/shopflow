# KSOPS exec generator: decrypts this component's Secrets in the Argo CD repo-server at build time.
# Generated by scripts/data-secrets.sh (random values, encrypted in a pipe). `files` resolve from local/.
#   seaweedfs-s3-config: s3.json, the lake's S3 identities (polaris, iceberg-sink, trino-lake, trino-lake-ro, flink)
#   seaweedfs-cnpg-backup: the backup identity's keys (group backup), merged into s3.json at pod start
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: seaweedfs-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets/seaweedfs-s3-config.enc.yaml
  - ./secrets/seaweedfs-cnpg-backup.enc.yaml
