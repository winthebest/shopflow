# Local (k3d): small volume and memory. On AWS the lake lives in S3 and this component is not deployed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
generators:
  - secrets/ksops-generator.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
      name: seaweedfs-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: Deployment
      name: seaweedfs
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
