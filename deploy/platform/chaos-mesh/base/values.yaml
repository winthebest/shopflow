# Chaos Mesh: installed only for a game day (profile `chaos`) and removed right after
# (docs/adr/0303-chaos-mesh-game-day-only.md, docs/runbooks/gameday.md).
# 2.8.4 (2026-08): >= 2.7.3, which fixed the unauthenticated GraphQL server (CVE-2025-59358..61).
# The chart builds images as <registry>/<repository>:<tag>, so tag@digest pins them.
images:
  registry: ghcr.io

controllerManager:
  replicaCount: 1
  image:
    tag: "v2.8.4@sha256:9e48285bb44c63be80f2fe4468c54b0f2d7cdc447ba5f5bc9ded4ab6a973cd37"
  # Only pods in namespaces annotated chaos-mesh.org/inject=enabled can be targeted (shop, kafka on game days).
  enableFilterNamespace: true
  # chaosd (physical machines) is not used; its certs would be regenerated by Helm on every Argo CD render.
  chaosdSecurityMode: false
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {memory: 256Mi}

chaosDaemon:
  image:
    tag: "v2.8.4@sha256:0d28dbd95b033279f65605ea88c354d25fe902409197274016dd2efc28ef25cd"
  runtime: containerd
  # socketPath is per environment (local/ and aws/ values).
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}

# No dashboard (it was the attack surface of the 2025 CVEs) and no DNS server (DNSChaos is not used).
dashboard:
  create: false
dnsServer:
  create: false

# Webhook and chaos-daemon mTLS certificates from cert-manager (core profile). The chart's default generates
# them in templates (genCA), which Argo CD would re-render into new certificates on every sync.
webhook:
  certManager:
    enabled: true
