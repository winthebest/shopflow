# Topics Debezium writes to. Partitions: 1 per table keeps per-row ordering trivially (one task, low volume).
# Retention 7d with delete (not compact): the topics carry change history; bronze is the long-term copy.
# The Iceberg control topic is per CDC epoch, so it is created by the epoch tooling, not here (docs/adr/0406).
# replicas is omitted: the broker's default.replication.factor (set per overlay) applies.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: shop-public-customers
  labels:
    strimzi.io/cluster: shopflow
spec:
  topicName: shop.public.customers
  partitions: 1
  config:
    cleanup.policy: delete
    retention.ms: 604800000
---
