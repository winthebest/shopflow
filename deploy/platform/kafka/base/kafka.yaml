# Kafka 4.x in KRaft mode (Strimzi 1.x: v1 API, node pools only). docs/adr/0400, 0403, 0404.
# One TLS listener with SCRAM-SHA-512 and simple ACLs: no anonymous or plaintext client can connect.
# Environment sizing (replicas, replication factors, storage, memory) lives in the overlays.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: shopflow
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: true
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: shopflow
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    # Digest of quay.io/strimzi/kafka:1.2.0-kafka-4.3.1 (checked against the image's version label).
    image: quay.io/strimzi/kafka:1.2.0-kafka-4.3.1@sha256:fef34b5438e8556cc08c01f3e254e47346f061b53a4e38d4289853777e0ea7f1
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
    config:
      # Every topic is a KafkaTopic CR (or created by tooling, e.g. the per-epoch Iceberg control topic).
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
