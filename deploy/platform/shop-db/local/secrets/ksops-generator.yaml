# KSOPS: decrypts the debezium role password into Secret shop/shop-db-debezium (local only; AWS uses ESO).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: shop-db-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./shop-db-debezium.enc.yaml
