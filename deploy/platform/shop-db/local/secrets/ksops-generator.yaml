# KSOPS: decrypts the shop-db role passwords into Secrets in namespace shop (local only; AWS uses ESO).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: shop-db-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # Paths are relative to the overlay (where kustomize runs), not to this file.
  - ./secrets/shop-db-debezium.enc.yaml
  - ./secrets/shop-db-trino-pg.enc.yaml
  - ./secrets/shop-db-polaris.enc.yaml
  - ./secrets/shop-db-airflow.enc.yaml
  - ./secrets/shop-db-flink-serving.enc.yaml
  - ./secrets/shop-db-grafana-serving.enc.yaml
