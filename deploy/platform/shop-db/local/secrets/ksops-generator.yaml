# KSOPS: decrypts the debezium role password into Secret shop/shop-db-debezium (local only; AWS uses ESO).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: shop-db-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # Paths are relative to the overlay (where kustomize runs), not to this file.
  - ./secrets/shop-db-debezium.enc.yaml
