# Shop database (docs/contracts/services.md): database `shop`, owner `shop_app` (non-superuser). CNPG creates the
# Secret `shop-db-app` (keys `uri`, `password`, ...) that the orders service and the migration Job read.
# wal_level=logical from day 1 for Debezium CDC (Phase 4). Login roles for other consumers are declared below
# (docs/contracts/services.md "CDC source objects"); each overlay provides their password Secrets
# (`shop-db-debezium`, `shop-db-trino-pg`, `shop-db-polaris`). Grants on shop tables are Alembic's (sf-app).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shop-db
  labels:
    app.kubernetes.io/part-of: shopflow
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-minimal-trixie@sha256:ca2c3bb893d185fe4e5d0401a010454bd87dcb67c53003c38fd828804928f5d9
  postgresql:
    parameters:
      wal_level: logical
      # A replication slot whose consumer is gone (Kafka Connect down) would retain WAL until the volume is full
      # and the shop stops. Cap it: past this size the slot is invalidated and CDC re-snapshots into a new
      # epoch (docs/adr/0203-cnpg-over-rds.md). Sized against the 5Gi volume, leaving room for max_wal_size.
      max_slot_wal_keep_size: 2GB
    # Each consumer role may only reach its own database; CNPG keeps its default rules after these. debezium's
    # logical replication connections name database `shop`, so they match its first rule; `all` never matches
    # physical replication, which only streaming_replica may use.
    pg_hba:
      - host shop debezium all scram-sha-256
      - host all debezium all reject
      - host shop trino_pg all scram-sha-256
      - host all trino_pg all reject
      - host catalog polaris all scram-sha-256
      - host all polaris all reject
  bootstrap:
    initdb:
      database: shop
      owner: shop_app
  enableSuperuserAccess: false
  managed:
    roles:
      - name: debezium
        ensure: present
        comment: Debezium CDC (LOGIN REPLICATION, owns nothing)
        login: true
        replication: true
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        passwordSecret:
          name: shop-db-debezium
      - name: trino_pg
        ensure: present
        comment: Trino catalog pg (read-only grants from Alembic)
        login: true
        inherit: true
        passwordSecret:
          name: shop-db-trino-pg
      - name: polaris
        ensure: present
        comment: Polaris catalog metastore (owns database catalog only)
        login: true
        inherit: true
        passwordSecret:
          name: shop-db-polaris
  storage:
    size: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
