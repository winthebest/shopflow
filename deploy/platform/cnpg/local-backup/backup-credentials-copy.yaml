# Local restore drill (ADR 0203, docs/contracts/gitops.md §5): copies the credentials of sf-data's SeaweedFS identity
# cnpg-backup (lakehouse/seaweedfs-cnpg-backup: access-key-id, secret-access-key) into shop/shop-db-backup-s3, which
# the shop-db ObjectStore reads. Owned by the consumer (this plugin app), no second copy in git, no age key. Runs in
# cnpg-system on every sync; backoffLimit gives SeaweedFS (another root app) time to create the identity first.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-db-backup-copy
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop-db-backup-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [seaweedfs-cnpg-backup]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-db-backup-copy
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shop-db-backup-copy
subjects:
  - kind: ServiceAccount
    name: shop-db-backup-copy
    namespace: cnpg-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop-db-backup-copy
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [shop-db-backup-s3]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-db-backup-copy
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shop-db-backup-copy
subjects:
  - kind: ServiceAccount
    name: shop-db-backup-copy
    namespace: cnpg-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: shop-db-backup-copy
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-db-backup-copy
        app.kubernetes.io/part-of: shopflow
    spec:
      restartPolicy: Never
      serviceAccountName: shop-db-backup-copy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          command: ["python", "-I", "/scripts/copy-secret.py"]
          env:
            - name: SOURCE_NAMESPACE
              value: lakehouse
            - name: SOURCE_NAME
              value: seaweedfs-cnpg-backup
            - name: TARGET_NAMESPACE
              value: shop
            - name: TARGET_NAME
              value: shop-db-backup-s3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: shop-db-backup-copy-script
