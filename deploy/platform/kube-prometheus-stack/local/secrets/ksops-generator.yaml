# KSOPS exec generator: decrypts the observability Secrets in the Argo CD repo-server at build time.
# `files` are resolved from the kustomization root (local/), not from this file's directory.
#   grafana-admin         admin-user / admin-password (random, never displayed) for Grafana
#   alertmanager-webhook  url: placeholder until the owner sets the real Discord webhook with `sops <file>`
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: kube-prometheus-stack-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets/grafana-admin.enc.yaml
  - ./secrets/alertmanager-webhook.enc.yaml
