# Local (k3d) overlay: short retention, small PVCs, laptop-sized requests (profile budget in plan.md).
prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: 4GB
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 64Mi}

prometheusOperator:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 128Mi}

grafana:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 96Mi}

prometheus-node-exporter:
  # k3d nodes are containers in the Docker Desktop VM: the host root is not a shared mount.
  hostRootFsMount:
    enabled: false
  resources:
    requests: {cpu: 10m, memory: 24Mi}
    limits: {memory: 64Mi}
