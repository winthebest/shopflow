# Grafana admin on AWS: same Secret name and keys as the local SOPS file (local/secrets/grafana-admin.enc.yaml).
# SSM SecureString JSON at /shopflow/aws/observability/grafana-admin, seeded by sf-cloud's session tooling.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: ssm-observability}
  target: {name: grafana-admin, creationPolicy: Owner}
  data:
    - {secretKey: admin-user, remoteRef: {key: /shopflow/aws/observability/grafana-admin, property: admin-user}}
    - {secretKey: admin-password, remoteRef: {key: /shopflow/aws/observability/grafana-admin, property: admin-password}}
