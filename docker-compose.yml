# Dev loop only (`make dev`); Kubernetes manifests live in deploy/charts/shop.
# Host ports: Postgres 25432 (docs/contracts/environment.md), gateway 8000. Everything binds to 127.0.0.1.
name: shopflow

x-service: &service
  read_only: true            # same as readOnlyRootFilesystem in Kubernetes: only /tmp is writable
  tmpfs: [/tmp]
  restart: unless-stopped
  stop_grace_period: 25s     # services drain in-flight requests for up to 20s on SIGTERM
  environment: &service-env
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Trace ids in logs without a collector: SDK on, exporter off (Phase 3 sets the OTLP endpoint instead).
    OTEL_SDK_DISABLED: "false"
    OTEL_TRACES_EXPORTER: none
    OTEL_SEMCONV_STABILITY_OPT_IN: http

x-db-env: &db-env
  # Dev-only credentials for a container bound to localhost; Kubernetes uses the CNPG secret `shop-db-app`.
  DATABASE_URL: postgresql://shop_app:shop_app@postgres:5432/shop

services:
  postgres:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    configs:
      # Like CNPG: the app role owns the `shop` database but is not a superuser, so migrations that need more
      # privileges fail here too, not first in the cluster.
      - source: init-shop-db
        target: /docker-entrypoint-initdb.d/10-shop.sql
    ports: ["127.0.0.1:25432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # TCP, not the socket: the image's init-time server listens on the socket only, before init scripts finish.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shop_app", "-d", "shop"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      start_interval: 1s

  migrate:
    build: {context: ., dockerfile: services/orders/Dockerfile}
    image: shopflow-orders:dev
    command: ["migrate"]
    read_only: true
    tmpfs: [/tmp]
    environment: {<<: *db-env}
    depends_on:
      postgres: {condition: service_healthy}

  seed:
    image: shopflow-orders:dev
    command: ["seed"]
    read_only: true
    tmpfs: [/tmp]
    environment: {<<: *db-env}
    depends_on:
      migrate: {condition: service_completed_successfully}

  payments:
    <<: *service
    build: {context: ., dockerfile: services/payments/Dockerfile}
    image: shopflow-payments:dev
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: payments
      PAYMENT_LATENCY_MS: ${PAYMENT_LATENCY_MS:-50}
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.02}
    healthcheck: &healthcheck
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen(sys.argv[1], timeout=2)", "http://localhost:8002/readyz"]
      interval: 10s # each probe starts a Python interpreter: keep it rare once healthy (perf baseline noise)
      timeout: 3s
      start_period: 30s
      start_interval: 1s

  orders:
    <<: *service
    image: shopflow-orders:dev
    environment:
      <<: [*service-env, *db-env]
      OTEL_SERVICE_NAME: orders
      PAYMENTS_URL: http://payments:8002
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen(sys.argv[1], timeout=2)", "http://localhost:8001/readyz"]
    depends_on:
      seed: {condition: service_completed_successfully}
      payments: {condition: service_healthy}

  gateway:
    <<: *service
    build: {context: ., dockerfile: services/gateway/Dockerfile}
    image: shopflow-gateway:dev
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: gateway
      ORDERS_URL: http://orders:8001
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen(sys.argv[1], timeout=2)", "http://localhost:8000/readyz"]
    depends_on:
      orders: {condition: service_healthy}

volumes:
  pgdata:

configs:
  # Runs only on an empty volume: after changing it, `make dev-reset`.
  init-shop-db:
    content: |
      CREATE ROLE shop_app LOGIN PASSWORD 'shop_app';
      CREATE DATABASE shop OWNER shop_app;
      -- CDC reader (Phase 4): replication, no superuser, owns nothing; grants come from Alembic 0002.
      CREATE ROLE debezium LOGIN REPLICATION PASSWORD 'debezium';
