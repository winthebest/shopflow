# Data contract: CDC source table public.shipments (publication shop_cdc).
# Consumers: Debezium -> Kafka -> Iceberg bronze/silver (sf-data). Must match the schema Alembic builds;
# scripts/check_contracts.py enforces it in CI. Breaking change (column dropped or renamed, type narrowed,
# nullable -> NOT NULL, primary key changed) => bump `version`. Adding a column or widening a type is not.
table: shipments
version: 1
primary_key: [id]
columns:
  - name: id
    type: bigint
    nullable: false
  - name: order_id
    type: bigint
    nullable: false
  - name: cdc_epoch
    type: integer
    nullable: false
  - name: source_lsn
    type: bigint
    nullable: false
  - name: created_at
    type: timestamp with time zone
    nullable: false
  - name: updated_at
    type: timestamp with time zone
    nullable: false
