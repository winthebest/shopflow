# Standalone uv project (not a member of the shop services workspace): dbt + its linter, pinned by uv.lock.
# CI runs `make data-dbt-check` (dbt parse + sqlfluff); the Airflow image installs the same pins.
[project]
name = "shopflow-dbt"
version = "0.1.0"
description = "dbt project: Iceberg bronze -> silver -> gold through Trino"
requires-python = ">=3.12"
dependencies = [
    "dbt-core==1.12.5",
    "dbt-trino==1.10.6",
]

[dependency-groups]
dev = [
    "sqlfluff==4.4.0",
]

[tool.uv]
package = false
