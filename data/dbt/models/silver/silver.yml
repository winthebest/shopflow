version: 2

# Current state of each shop table in the latest completed CDC epoch (macros/cdc.sql), rebuilt in full on every run.
# Tests tagged `reconciliation` compare with Postgres (tests/generic/reconciles_with_postgres.sql). They exist only
# with --vars '{reconcile: true}' (the daily reconciliation DAG): absent from the default manifest, the hourly run
# (Cosmos renders tasks from that manifest) can never pick them up.
# not_null on every column gold reads that the contracts (data/contracts) make NOT NULL: a column renamed or dropped
# in Postgres reaches bronze as NULL (the sink drops unknown fields), and accepted_values / relationships pass NULLs,
# so without it only the daily reconciliation would notice.
# Foreign keys to orders use relationships_up_to_parent_cut (tests/generic): the silver models read bronze at
# different moments, and orders changes together with its children, so a child newer than orders' newest change is not
# checked yet. customers and products change only at seed or snapshot time: their foreign keys keep relationships.

models:
  - name: customers
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [not_null]
      - name: created_at
        data_tests: [not_null]
    data_tests:
      - reconciles_with_postgres:
          arguments: {source_table: customers, compare: [email, name]}
          config: {tags: [reconciliation], enabled: "{{ var('reconcile') }}"}

  - name: products
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: sku
        data_tests: [unique, not_null]
    data_tests:
      - reconciles_with_postgres:
          arguments: {source_table: products, compare: [sku, name, price]}
          config: {tags: [reconciliation], enabled: "{{ var('reconcile') }}"}

  - name: orders
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('customers'), field: id}
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [pending, paid, failed]}
      - name: total
        data_tests: [not_null]
      - name: created_at
        data_tests: [not_null]
      - name: updated_at
        data_tests: [not_null]
    data_tests:
      - reconciles_with_postgres:
          arguments: {source_table: orders, compare: [customer_id, status, total]}
          config: {tags: [reconciliation], enabled: "{{ var('reconcile') }}"}

  - name: order_items
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships_up_to_parent_cut:
              arguments: {to: ref('orders'), field: id}
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('products'), field: id}
      - name: quantity
        data_tests: [not_null]
      - name: unit_price
        data_tests: [not_null]
    data_tests:
      - reconciles_with_postgres:
          arguments: {source_table: order_items, compare: [order_id, product_id, quantity, unit_price]}
          config: {tags: [reconciliation], enabled: "{{ var('reconcile') }}"}

  - name: payments
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships_up_to_parent_cut:
              arguments: {to: ref('orders'), field: id}
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [succeeded, declined, error]}
      - name: created_at
        data_tests: [not_null]
    data_tests:
      - reconciles_with_postgres:
          arguments: {source_table: payments, compare: [order_id, amount, status]}
          config: {tags: [reconciliation], enabled: "{{ var('reconcile') }}"}
