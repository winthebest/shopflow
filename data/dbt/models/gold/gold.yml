version: 2

# Business marts read by Metabase (Trino `lake_ro`, schema gold) and measured by the gold-freshness SLO
# (`$snapshots` of each table).

models:
  - name: fct_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_customers'), field: customer_id}
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: [pending, paid, failed]}

  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: mart_daily_revenue
    columns:
      - name: order_date
        data_tests: [unique, not_null]

  - name: mart_payment_success_rate
    columns:
      - name: payment_date
        data_tests: [unique, not_null]

  - name: mart_customer_ltv
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments: {to: ref('dim_customers'), field: customer_id}
