# Agent and eval CI: never calls an LLM API and holds no API key. The provider contract runs against fakes that
# reject like the real backends, recorded LLM calls replay from cassettes (evals/replay.py), and the live tests
# (Claude API, local Ollama) skip and say why in the -ra summary. Golden guard decisions join when the guard exists.
# Same supply-chain rules as ci.yml: actions pinned to full SHAs, least-privilege permissions per job, no cache.
name: eval

on:
  pull_request:
    paths:
      - agent/**
      - evals/**
      - .github/workflows/eval.yml
  push:
    branches: [main]
    paths:
      - agent/**
      - evals/**
      - .github/workflows/eval.yml

permissions: {}

concurrency:
  group: eval-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.29"

jobs:
  agent:
    name: agent (lint + provider contract, no API)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install agent project (locked)
        run: uv sync --locked
      - name: ruff (agent/ and evals/)
        run: |
          uv run ruff check --output-format=github . ../evals
          uv run ruff format --check . ../evals
      - name: pytest (provider contract and LLM replay; live Claude and Ollama tests skip, the summary lists why)
        run: uv run pytest
