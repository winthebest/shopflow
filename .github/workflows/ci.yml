# Shop app CI: lint + tests, secret scan, workflow lint, image build + vulnerability scan on every PR and push;
# multi-arch images pushed to GHCR only after a merge to main.
#
# Supply-chain rules (checked by the `zizmor` job):
# - every `uses:` is pinned to a full commit SHA taken from the upstream release tag (comment = tag);
#   zizmor's online `impostor-commit` audit fails if a SHA is not reachable from the upstream repository (fork commit)
# - least-privilege `permissions:` per job, nothing at workflow level; no job has `id-token: write`
# - no `pull_request_target` (zizmor `dangerous-triggers`)
# - third-party images pinned by digest; Trivy pinned by action SHA + `version` (GHSA-69fq-xp46-6x23: tags were
#   force-pushed in 2026-03, so never reference Trivy by tag)
# - no GitHub Actions cache anywhere (setup-uv, trivy-action): a poisoned cache could reach the publish path
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# PRs: one run per branch, a new push cancels the old run. main: one group per commit, so a queued commit is never
# replaced by a newer one and every merge gets its own `sha-<short>` images.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.29"
  ZIZMOR_VERSION: "1.30.1"
  TRIVY_VERSION: "v0.75.0"
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  lint-test:
    name: lint + test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # no shared cache in a workflow that publishes images
      - name: Install workspace (locked)
        run: uv sync --all-packages --locked
      - name: ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: pytest (unit + integration on real Postgres via testcontainers)
        run: uv run pytest

  contracts:
    name: data contracts (Alembic on real Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the baseline contracts are read from the base commit
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install workspace (locked)
        run: uv sync --all-packages --locked
      - name: Postgres from docker-compose.yml (same image, init roles shop_app + debezium)
        run: docker compose up --detach --wait postgres
      # Baseline HEAD^1: on a PR, the first parent of the merge commit = the exact base it was built from;
      # on main (squash merges only), the previous commit.
      - name: Contracts vs migrated schema, publication shop_cdc and the base commit
        env:
          DATABASE_URL: postgresql://shop_app:shop_app@localhost:25432/shop
        run: uv run scripts/check_contracts.py --base-ref HEAD^1

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # scan the whole history, not only the last commit
      - name: gitleaks (git history, .gitleaks.toml)
        # Same uid as the checkout so git trusts the repo; fail if git history was not readable (0 commits).
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner 2>&1 | tee gitleaks.log
          status=${PIPESTATUS[0]}
          if grep -q ' 0 commits scanned' gitleaks.log; then echo "::error::gitleaks scanned 0 commits"; exit 1; fi
          exit "$status"

  zizmor:
    name: workflow lint (zizmor + SHA pins)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Every action reference is a full commit SHA
        run: |
          unpinned=$(grep -rnE '^\s*(-\s+)?uses:' .github/workflows \
            | grep -vE 'uses:\s*\./' \
            | grep -vE 'uses:\s*[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::uses: must be pinned to a full commit SHA"
            echo "$unpinned"
            exit 1
          fi
      - name: zizmor (online audits on, e.g. impostor-commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx "zizmor==${ZIZMOR_VERSION}" --format=github --min-severity=low .github/workflows

  image:
    name: image ${{ matrix.service }} (build + Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, orders, payments]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64, loaded for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: shopflow-${{ matrix.service }}:ci
      - name: Trivy (fail on CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: shopflow-${{ matrix.service }}:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          cache: false # no Actions cache in a workflow that publishes images; the DB download takes ~10s

  publish:
    name: publish ${{ matrix.service }} (GHCR, multi-arch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-test, contracts, gitleaks, zizmor, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push ghcr.io/winthebest/shopflow-<service>
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, orders, payments]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/winthebest/shopflow-${{ matrix.service }}
          tags: type=sha,prefix=sha-,format=short
      - id: build
        name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$TAGS" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
