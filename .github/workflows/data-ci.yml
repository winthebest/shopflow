# sf-data checks that need no cluster: GitOps components (render + kubeconform), freshness-exporter tests, dbt (parse
# + sqlfluff), and the image builds (each only when its sources change: Kafka Connect cached, freshness-exporter +
# Trivy, Airflow + DAG import check + Trivy, Flink + SQL plan check + Trivy). Nothing here publishes, so builds may use
# the Actions cache; publishing is data-images.yml.
# Actions are pinned by commit SHA (tag in the comment). Read-only token, no id-token.
name: data-ci

on:
  pull_request:
    paths:
      - deploy/platform/strimzi/**
      - deploy/platform/kafka/**
      - deploy/platform/kafka-connect/**
      - deploy/platform/seaweedfs/**
      - deploy/platform/iceberg-catalog/**
      - deploy/platform/trino/**
      - deploy/platform/freshness-exporter/**
      - deploy/argocd/apps/**
      - deploy/argocd/profiles/data/**
      - deploy/argocd/profiles/batch/**
      - data/contracts/**  # the CDC table list and bronze columns are checked against them
      - data/dbt/**
      - data/airflow/**
      - data/.dockerignore
      - data/flink/**
      - images/kafka-connect/**
      - services/freshness-exporter/**
      - scripts/data-*.sh
      - scripts/cdc-epoch.sh
      - mk/data.mk
      - .github/workflows/data-ci.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Same rule as ci.yml: superseded pull-request runs are cancelled, runs on main never are.
concurrency:
  group: data-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Install kubeconform (checksum verified)
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform

      - name: Render and validate data components
        run: make data-validate

      - name: shellcheck (sf-data scripts)
        run: shellcheck scripts/data-*.sh scripts/cdc-epoch.sh images/kafka-connect/*.sh images/kafka-connect/smoke/*.sh

  freshness-exporter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Lint and unit tests
        run: make data-exporter-test

  dbt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: dbt parse + sqlfluff
        run: make data-dbt-check

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      connect-image: ${{ steps.diff.outputs.connect_image }}
      exporter-image: ${{ steps.diff.outputs.exporter_image }}
      airflow-image: ${{ steps.diff.outputs.airflow_image }}
      flink-image: ${{ steps.diff.outputs.flink_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Which images changed?
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed() {
            if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2> /dev/null; then
              git diff --name-only "$BASE" HEAD | grep -qE "^($1|\.github/workflows/data-ci\.yml$)" && echo true || echo false
            else
              echo true
            fi
          }
          {
            # The Connect smoke test also runs the Polaris setup script and the bronze DDL.
            echo "connect_image=$(changed 'images/kafka-connect/|deploy/platform/iceberg-catalog/base/polaris-setup\.py$|deploy/platform/trino/base/bronze-tables\.sql$')"
            echo "exporter_image=$(changed 'services/freshness-exporter/')"
            echo "airflow_image=$(changed 'data/airflow/|data/dbt/|data/\.dockerignore')"
            echo "flink_image=$(changed 'data/flink/')"
          } >> "$GITHUB_OUTPUT"

  connect-image:
    needs: changes
    if: needs.changes.outputs.connect-image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Both platforms must build. The Iceberg build stage is cached by its inputs (version + sha512 ARGs), so it
      # only recompiles when the pinned Iceberg release changes.
      - name: Build both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/kafka-connect
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=kafka-connect
          cache-to: type=gha,scope=kafka-connect,mode=max

      - name: Load amd64 for the plugin check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/kafka-connect
          platforms: linux/amd64
          load: true
          tags: shopflow-kafka-connect:ci
          cache-from: type=gha,scope=kafka-connect

      - name: Check that Connect discovers both plugins
        run: images/kafka-connect/check-plugins.sh shopflow-kafka-connect:ci

  exporter-image:
    needs: changes
    if: needs.changes.outputs.exporter-image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build freshness-exporter (linux/amd64, loaded for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/freshness-exporter
          platforms: linux/amd64
          load: true
          tags: shopflow-freshness-exporter:ci

      - name: Trivy (fail on CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: shopflow-freshness-exporter:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          cache: false

  airflow-image:
    needs: changes
    if: needs.changes.outputs.airflow-image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Airflow (linux/amd64, loaded for the DAG check and scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: data
          file: data/airflow/Dockerfile
          platforms: linux/amd64
          load: true
          tags: shopflow-airflow:ci
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,scope=airflow,mode=max

      - name: Import every DAG and check ids, schedules and tasks
        run: make data-airflow-check AIRFLOW_IMAGE=shopflow-airflow:ci

      - name: Trivy (fail on CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: shopflow-airflow:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          cache: false

  flink-image:
    needs: changes
    if: needs.changes.outputs.flink-image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Flink (linux/amd64, loaded for the plan check and scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: data/flink
          platforms: linux/amd64
          load: true
          tags: shopflow-flink:ci
          cache-from: type=gha,scope=flink
          cache-to: type=gha,scope=flink,mode=max

      - name: Plan the KPI job (connectors load, SQL valid)
        run: make data-flink-check FLINK_IMAGE=shopflow-flink:ci

      - name: Trivy (fail on CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: shopflow-flink:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          cache: false
