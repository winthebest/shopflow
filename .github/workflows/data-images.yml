# Publishes sf-data's images after a merge to main; the only sf-data workflow with `packages: write`:
#   ghcr.io/<owner>/shopflow-kafka-connect:sha-<short>       images/kafka-connect (amd64 + arm64)
#   ghcr.io/<owner>/shopflow-freshness-exporter:sha-<short>  services/freshness-exporter (amd64 + arm64, Trivy)
# Only images whose sources changed are rebuilt. Pull requests are built (and scanned) by data-ci.yml.
# Publishing jobs restore no Actions cache: a clean build every time (repo rule, see ci.yml).
# Actions are pinned by commit SHA (tag in the comment). No job requests id-token.
name: data-images

on:
  push:
    branches: [main]
    paths:
      - images/kafka-connect/**
      - services/freshness-exporter/**
      - .github/workflows/data-images.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-images-${{ github.sha }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: "v0.75.0"

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      kafka-connect: ${{ steps.diff.outputs.kafka_connect }}
      freshness-exporter: ${{ steps.diff.outputs.freshness_exporter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A manual run (or a push whose base is unknown) rebuilds both images.
      - name: Which images changed?
        id: diff
        env:
          BASE: ${{ github.event.before }}
        run: |
          changed() {
            if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2> /dev/null; then
              git diff --name-only "$BASE" HEAD | grep -qE "^($1|\.github/workflows/data-images\.yml$)" && echo true || echo false
            else
              echo true
            fi
          }
          {
            echo "kafka_connect=$(changed 'images/kafka-connect/')"
            echo "freshness_exporter=$(changed 'services/freshness-exporter/')"
          } >> "$GITHUB_OUTPUT"

  kafka-connect:
    needs: changes
    if: needs.changes.outputs.kafka-connect == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/shopflow-kafka-connect
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/shopflow-kafka-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      # The Iceberg runtime compiles once on the amd64 runner (its stage runs on the build platform); the
      # per-architecture stage only copies files, so arm64 needs no emulation.
      - name: Build amd64 for the plugin check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/kafka-connect
          platforms: linux/amd64
          load: true
          tags: shopflow-kafka-connect:ci

      - name: Check that Connect discovers both plugins
        run: images/kafka-connect/check-plugins.sh shopflow-kafka-connect:ci

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Reuses this job's builder state from the step above; nothing comes from the Actions cache.
      - name: Build and push both platforms
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/kafka-connect
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Kafka Connect image"
            echo
            echo "\`${IMAGE}:${TAG}@${DIGEST}\`"
            echo
            echo "Pin this reference in deploy/platform/kafka-connect (KafkaConnect.spec.image)."
          } >> "$GITHUB_STEP_SUMMARY"

  freshness-exporter:
    needs: changes
    if: needs.changes.outputs.freshness-exporter == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/shopflow-freshness-exporter
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/shopflow-freshness-exporter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The final stage runs RUN steps (user creation), so arm64 is built under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Build amd64 for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/freshness-exporter
          platforms: linux/amd64
          load: true
          tags: shopflow-freshness-exporter:ci

      - name: Trivy (fail on CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: shopflow-freshness-exporter:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          cache: false # no Actions cache in a workflow that publishes images

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=sha-,format=short

      - id: push
        name: Build and push both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/freshness-exporter
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### freshness-exporter image"
            echo
            echo "\`${TAGS}@${DIGEST}\`"
            echo
            echo "Pin this reference in deploy/platform/freshness-exporter."
          } >> "$GITHUB_STEP_SUMMARY"
