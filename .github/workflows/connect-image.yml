# Publishes the Kafka Connect image (images/kafka-connect) for amd64 + arm64 after a merge to main:
# ghcr.io/<owner>/shopflow-kafka-connect:sha-<short sha>. Pull requests are built (with a cache) by data-ci.yml.
# This workflow publishes, so it restores no Actions cache: a clean build every time (repo rule, see ci.yml).
# Actions are pinned by commit SHA (tag in the comment). No job requests id-token.
name: connect-image

on:
  push:
    branches: [main]
    paths:
      - images/kafka-connect/**
      - .github/workflows/connect-image.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: connect-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/shopflow-kafka-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      # The Iceberg runtime compiles once on the amd64 runner (its stage runs on the build platform); the
      # per-architecture stage only copies files, so arm64 needs no emulation.
      - name: Build amd64 for the plugin check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/kafka-connect
          platforms: linux/amd64
          load: true
          tags: shopflow-kafka-connect:ci

      - name: Check that Connect discovers both plugins
        run: images/kafka-connect/check-plugins.sh shopflow-kafka-connect:ci

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Reuses this job's builder state from the step above; nothing comes from the Actions cache.
      - name: Build and push both platforms
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/kafka-connect
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Kafka Connect image"
            echo
            echo "\`${IMAGE}:${TAG}@${DIGEST}\`"
            echo
            echo "Pin this reference in deploy/platform/kafka-connect (KafkaConnect.spec.image)."
          } >> "$GITHUB_STEP_SUMMARY"
