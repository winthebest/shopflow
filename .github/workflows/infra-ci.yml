# Infra CI: OpenTofu fmt/validate/test (mocked AWS, no credentials), tflint, trivy config and the reaper tests.
# The `plan` job is the only one with AWS access: read-only role ci-plan through OIDC, same-repo pull requests
# only, and switched off until the repository variable INFRA_PLAN_ENABLED=true (set once layer 0 exists).
# No job can apply infrastructure (ADR 0509).
#
# Supply-chain rules follow ci.yml: actions pinned to full commit SHAs, images pinned by digest, least-privilege
# permissions per job, no Actions cache. zizmor runs repo-wide in ci.yml.
name: infra-ci

on:
  pull_request:
    paths:
      - infra/**
      - mk/cloud.mk
      - .github/workflows/infra-ci.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - mk/cloud.mk
      - .github/workflows/infra-ci.yml

permissions: {}

concurrency:
  group: infra-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TOFU_VERSION: "1.13.1"
  TFLINT_VERSION: "v0.64.0"
  UV_VERSION: "0.11.29"

jobs:
  tofu:
    name: tofu fmt + validate + test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: make cloud-fmt cloud-test

  tflint:
    name: tflint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          cache: false
      - run: make cloud-lint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download from GitHub releases (rate limit)

  trivy:
    name: trivy config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make cloud-trivy

  python:
    name: reaper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: make cloud-pytest

  plan:
    name: tofu plan ${{ matrix.layer }} (read-only role)
    # Off until layer 0 exists and the orchestrator enables it; never for forks (no OIDC token there anyway).
    if: >-
      vars.INFRA_PLAN_ENABLED == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: [tofu]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC -> shopflow-ci-plan (read-only, cannot read SSM or data objects)
    strategy:
      fail-fast: false
      matrix:
        layer: [bootstrap, network, cluster]
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      # Plan-only placeholder (TEST-NET-1); cloud-up passes the operator's real /32.
      TF_VAR_operator_cidr: 192.0.2.1/32
      LAYER: ${{ matrix.layer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/shopflow-ci-plan
          aws-region: ap-southeast-1
      - name: tofu plan (no state lock, no apply)
        run: |
          tofu -chdir="infra/tofu/$LAYER" init -input=false -lockfile=readonly -backend-config="bucket=shopflow-tfstate-$AWS_ACCOUNT_ID"
          tofu -chdir="infra/tofu/$LAYER" plan -lock=false -input=false -no-color
