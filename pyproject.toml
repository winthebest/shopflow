# uv workspace root (virtual: not a package itself). Each service is a member with its own image.
[tool.uv.workspace]
members = [
    "services/common",
    "services/gateway",
    "services/orders",
    "services/payments",
]

[tool.uv]
required-version = ">=0.11"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pyyaml>=6.0",
    "ruff>=0.14",
    "testcontainers[postgres]>=4.13",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311", "S608"]  # SQL in tests uses constants and ids we inserted
"services/orders/migrations/**" = ["E501", "S608"]  # DDL built from module constants

[tool.ruff.lint.isort]
known-first-party = ["shopflow_common", "gateway", "orders", "payments"]

[tool.pytest.ini_options]
testpaths = ["services"]
pythonpath = ["scripts"]  # tests import scripts/check_contracts.py as `check_contracts`
# services/freshness-exporter is sf-data's standalone uv project with its own lockfile and test run (data-ci).
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--ignore=services/freshness-exporter"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Docker (real Postgres via testcontainers or a real server process)"]
