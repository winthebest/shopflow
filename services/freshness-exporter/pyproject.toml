# Standalone uv project (not a member of the shop services workspace): it ships its own image and lockfile.
[project]
name = "freshness-exporter"
version = "0.1.0"
description = "Prometheus exporter: data freshness of lakehouse tables, measured through Trino"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.26",
    "trino>=0.336",
]

[project.scripts]
freshness-exporter = "freshness_exporter.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
