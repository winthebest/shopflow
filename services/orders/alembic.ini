# Alembic is the only owner of the shop schema (docs/contracts/services.md).
# Database URL: DATABASE_URL env (or config.attributes["database_url"] when called from code).
# New revision: uv run alembic -c services/orders/alembic.ini revision -m "add x"   (with DATABASE_URL set)
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
