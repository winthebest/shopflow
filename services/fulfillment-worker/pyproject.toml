[project]
name = "shopflow-fulfillment-worker"
version = "0.1.0"
description = "Creates one shipment per paid order from the shop.public.orders CDC stream (Phase 7, KEDA-scaled)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shopflow-common[db]",
    "aiokafka>=0.12",
    "opentelemetry-instrumentation-asyncpg>=0.59b0",
]

[project.scripts]
fulfillment-worker = "fulfillment_worker.main:main"

[tool.uv.sources]
shopflow-common = { workspace = true }

[tool.uv.build-backend]
module-name = "fulfillment_worker"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
