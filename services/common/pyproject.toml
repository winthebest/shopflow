[project]
name = "shopflow-common"
version = "0.1.0"
description = "Shared runtime pieces for shopflow services: JSON logging, OpenTelemetry setup, server runner, API schemas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.120",
    "opentelemetry-api>=1.38",
    "opentelemetry-sdk>=1.38",
    "opentelemetry-exporter-otlp-proto-grpc>=1.38",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "opentelemetry-instrumentation-httpx>=0.59b0",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "uvicorn>=0.38",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
