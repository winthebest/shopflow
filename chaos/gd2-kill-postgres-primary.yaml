# Game day 2 — kill the CNPG primary of shop-db (Phase 7 scenario 2). Procedure: docs/runbooks/gameday.md.
# Two runs on fresh clusters from the same main revision, shop-db with 2 instances; only logical slot sync differs:
#   H-A: make up PG_INSTANCES=2 PG_LOGICAL_SLOT_SYNC=off: the standby keeps no copy of debezium_shop.
#   H-B: make up PG_INSTANCES=2: debezium_shop is created with failover=true and synced to the standby (CNPG
#        synchronizeLogicalDecoding). Before the kill the replica must show it with failover = t, synced = t.
# Hypothesis, both runs: CNPG promotes the replica within ~30 s (Cluster status: currentPrimaryFailingSinceTimestamp,
#   then targetPrimaryTimestamp, then currentPrimary = targetPrimary). Checkouts fail only until orders reconnects to
#   the new primary through shop-db-rw (seconds without an ack in k6's log). Replication is asynchronous, so an order
#   acked just before the kill can be lost: every acked order_id is looked up in Postgres after the failover.
# H-A: debezium_shop does not exist on the new primary. Debezium (snapshot.mode when_needed) finds its stored offset
#   unavailable ("Last recorded offset is no longer available on the server"), snapshots every table again into the
#   SAME epoch, then streams. Bronze gets the rows again as r, but silver's latest_state ranks streamed c/u above r: an
#   order updated or deleted during the gap stays stale in silver, and the Flink KPI (it counts c) misses orders created
#   in it. Nothing alerts (the heartbeat stays fresh) until the daily reconciliation. Measured with
#   scripts/sre-cdc-gap.sh; recovery: docs/runbooks/cdc-resnapshot.md (a new epoch).
# H-B: Debezium finds the promoted standby's synced slot ("Obtained valid replication slot", snapshot SKIPPED) and
#   resumes from its offset: a lag spike, no gap, no re-snapshot. A synced slot that was invalidated fails the task
#   instead (CdcConnectorFailed), which is loud.
# Blast radius: shop-db (namespace shop): checkout writes for seconds; CDC downstream (in H-A until the re-snapshot).
# Stop: one-shot kill. No new primary within 3 minutes: stop the load, record, `make down` (a fresh game-day cluster).
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: gd2-kill-postgres-primary
  namespace: shop
spec:
  action: pod-kill
  mode: one
  gracePeriod: 0
  selector:
    namespaces: [shop]
    labelSelectors:
      cnpg.io/cluster: shop-db
      cnpg.io/instanceRole: primary
