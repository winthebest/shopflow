# Game day 1 — payments 800ms slower (Phase 7 scenario 1). Procedure: docs/runbooks/gameday.md.
# Hypothesis (current image: retries inside the 800ms deadline, circuit breaker, unanswered orders left pending and
#   settled by the sweeper, HPA on orders and gateway; docs/adr/0102): every payments pod is 800ms slower, so no
#   attempt can answer in time.
#   - Within 1-2 s the breaker opens (>= 20 attempts in 10 s, >= 75% failed). From then on checkouts get a 503 in
#     milliseconds, before any order is created; about every 5.5 s one probe goes through, times out (~800ms) and
#     leaves its order pending with a 504.
#   - Availability: ~100% 5xx (503 + a few 504) → page by +5 min. Latency: fast 503s count as good, only the probes
#     are slow (~2%) → no latency page.
#   - Pending orders build up (~11/min) and the sweeper waits while the circuit is open; their age counts from
#     creation, so OrdersPendingTooOld (ticket) fires at ~+10-11 min.
#   - After the 15 minutes the next probe succeeds, the circuit closes, the sweeper settles the backlog (50 per 10 s
#     per replica) within 1-2 min and the ticket resolves.
#   - HPA (CPU) should not scale orders or gateway: waiting and failing fast use little CPU. If orders does scale,
#     each replica has its own breaker: more probes, more pending orders.
#   The run before the fix (one 800ms call, 504s, latency page by +10 min) cannot be repeated with this image; its
#   reference is slo/tests/checkout.test.yaml and ADR 0102. Retries are proven by gd1b (partial fault).
# Blast radius: payments pods only (namespace shop); checkout fails or is slow, browse is unaffected.
# Stop: automatic after `duration`. Failing checkouts (503/504) are the expected outcome, not a stop condition.
#   Earlier with `kubectl delete -f` if browse errors exceed 1% for 5 min or anything outside shop degrades.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: gd1-payments-latency
  namespace: shop
spec:
  action: delay
  mode: all
  selector:
    namespaces: [shop]
    labelSelectors:
      app.kubernetes.io/name: payments
  direction: to
  delay:
    latency: 800ms
    jitter: 50ms
    correlation: "0"
  duration: 15m
